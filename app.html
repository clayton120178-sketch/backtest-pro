// ─── PRICE DATA GENERATOR (deterministic seed, realistic price action) ────────
function _seededPrices(n, base, range, seed) {
  let s = seed || 42;
  const rng = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
  const prices = [base];
  for (let i = 1; i < n; i++) {
    const chg = (rng() - 0.48) * range * 0.08;
    prices.push(Math.max(base * 0.85, Math.min(base * 1.15, prices[i-1] + chg)));
  }
  return prices;
}

function _calcRSI(closes, period) {
  if (closes.length < period + 1) return closes.map(() => 50);
  const gains = [], losses = [];
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    gains.push(d > 0 ? d : 0);
    losses.push(d < 0 ? -d : 0);
  }
  const result = new Array(period).fill(null);
  let ag = gains.slice(0, period).reduce((a,b) => a+b, 0) / period;
  let al = losses.slice(0, period).reduce((a,b) => a+b, 0) / period;
  result.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al));
  for (let i = period; i < gains.length; i++) {
    ag = (ag * (period-1) + gains[i]) / period;
    al = (al * (period-1) + losses[i]) / period;
    result.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al));
  }
  return result;
}

function _calcSMA(closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    return closes.slice(i - period + 1, i + 1).reduce((a,b) => a+b, 0) / period;
  });
}

function _calcEMA(closes, period) {
  const k = 2 / (period + 1);
  const result = [];
  let ema = null;
  closes.forEach((c, i) => {
    if (i < period - 1) { result.push(null); return; }
    if (ema === null) { ema = closes.slice(0, period).reduce((a,b) => a+b, 0) / period; }
    else ema = c * k + ema * (1 - k);
    result.push(ema);
  });
  return result;
}

function _calcBB(closes, period, dev) {
  const sma = _calcSMA(closes, period);
  return closes.map((_, i) => {
    if (sma[i] === null) return null;
    const slice = closes.slice(i - period + 1, i + 1);
    const mean = sma[i];
    const std = Math.sqrt(slice.reduce((s, v) => s + (v - mean) ** 2, 0) / period);
    return { mid: sma[i], upper: sma[i] + dev * std, lower: sma[i] - dev * std };
  });
}

function _calcStoch(highs, lows, closes, k, d) {
  const result = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < k - 1) { result.push(null); continue; }
    const lo = Math.min(...lows.slice(i - k + 1, i + 1));
    const hi = Math.max(...highs.slice(i - k + 1, i + 1));
    result.push(hi === lo ? 50 : ((closes[i] - lo) / (hi - lo)) * 100);
  }
  return result;
}

function _calcMACD(closes, fast, slow, signal) {
  const emaF = _calcEMA(closes, fast);
  const emaS = _calcEMA(closes, slow);
  const macd = closes.map((_, i) => (emaF[i] !== null && emaS[i] !== null) ? emaF[i] - emaS[i] : null);
  const validMacd = macd.filter(v => v !== null);
  const sigLine = _calcEMA(validMacd, signal);
  let si = 0;
  const fullSig = macd.map(v => v === null ? null : (sigLine[si] !== undefined ? sigLine[si++] : null));
  const hist = macd.map((v, i) => v !== null && fullSig[i] !== null ? v - fullSig[i] : null);
  return { macd, signal: fullSig, hist };
}

function _calcATR(highs, lows, closes, period) {
  const tr = closes.map((c, i) => {
    if (i === 0) return highs[i] - lows[i];
    return Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1]));
  });
  return tr.map((_, i) => {
    if (i < period - 1) return null;
    return tr.slice(i - period + 1, i + 1).reduce((a,b) => a+b, 0) / period;
  });
}

function _calcCCI(highs, lows, closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    const typicals = closes.slice(i - period + 1, i + 1).map((c, j) => (highs[i - period + 1 + j] + lows[i - period + 1 + j] + c) / 3);
    const mean = typicals.reduce((a,b) => a+b, 0) / period;
    const mad = typicals.reduce((s, v) => s + Math.abs(v - mean), 0) / period;
    const tp = (highs[i] + lows[i] + closes[i]) / 3;
    return mad === 0 ? 0 : (tp - mean) / (0.015 * mad);
  });
}

// ADX (Wilder) — força da tendência (0–100), independente de direção
function _calcADX(highs, lows, closes, period) {
  const n = closes.length;
  const tr = [], pdm = [], ndm = [];
  for (let i = 0; i < n; i++) {
    if (i === 0) { tr.push(highs[i] - lows[i]); pdm.push(0); ndm.push(0); continue; }
    const upMove = highs[i] - highs[i-1];
    const dnMove = lows[i-1] - lows[i];
    pdm.push(upMove > dnMove && upMove > 0 ? upMove : 0);
    ndm.push(dnMove > upMove && dnMove > 0 ? dnMove : 0);
    tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  }
  const smooth = (arr) => {
    const out = new Array(arr.length).fill(null);
    if (arr.length < period) return out;
    let s = arr.slice(0, period).reduce((a,b)=>a+b, 0);
    out[period-1] = s;
    for (let i = period; i < arr.length; i++) { s = s - s/period + arr[i]; out[i] = s; }
    return out;
  };
  const tr_s = smooth(tr), pdm_s = smooth(pdm), ndm_s = smooth(ndm);
  const dx = tr_s.map((t, i) => {
    if (t == null || t === 0) return null;
    const pdi = (pdm_s[i] / t) * 100;
    const ndi = (ndm_s[i] / t) * 100;
    return ((pdi + ndi) === 0) ? 0 : (Math.abs(pdi - ndi) / (pdi + ndi)) * 100;
  });
  // ADX = média do DX nos últimos period
  const adx = dx.map((_, i) => {
    if (i < period * 2 - 1) return null;
    let s = 0, c = 0;
    for (let j = i - period + 1; j <= i; j++) if (dx[j] != null) { s += dx[j]; c++; }
    return c > 0 ? s / c : null;
  });
  return adx;
}

// SAR Parabólico simplificado — retorna {value, isAbove} por candle
function _calcSAR(highs, lows, step, max) {
  step = step || 0.02; max = max || 0.2;
  const n = highs.length;
  const out = [];
  let isLong = true;
  let af = step;
  let ep = highs[0]; // extreme point
  let sar = lows[0];
  out.push({ value: sar, isLong: true });
  for (let i = 1; i < n; i++) {
    sar = sar + af * (ep - sar);
    if (isLong) {
      sar = Math.min(sar, lows[i-1], i > 1 ? lows[i-2] : lows[i-1]);
      if (lows[i] < sar) { // reversão
        isLong = false; sar = ep; ep = lows[i]; af = step;
      } else {
        if (highs[i] > ep) { ep = highs[i]; af = Math.min(af + step, max); }
      }
    } else {
      sar = Math.max(sar, highs[i-1], i > 1 ? highs[i-2] : highs[i-1]);
      if (highs[i] > sar) {
        isLong = true; sar = ep; ep = highs[i]; af = step;
      } else {
        if (lows[i] < ep) { ep = lows[i]; af = Math.min(af + step, max); }
      }
    }
    out.push({ value: sar, isLong });
  }
  return out;
}

// HiLo Activator — usa SMA da High e SMA da Low; muda lado conforme rompimento
function _calcHiLo(highs, lows, closes, period) {
  const smaHigh = _calcSMA(highs, period);
  const smaLow  = _calcSMA(lows, period);
  const out = [];
  let mode = null; // 'buy' (linha = smaLow) ou 'sell' (linha = smaHigh)
  for (let i = 0; i < closes.length; i++) {
    if (smaHigh[i] === null || smaLow[i] === null) { out.push(null); continue; }
    if (mode === null) mode = closes[i] > smaHigh[i] ? 'buy' : 'sell';
    else if (mode === 'sell' && closes[i] > smaHigh[i]) mode = 'buy';
    else if (mode === 'buy' && closes[i] < smaLow[i]) mode = 'sell';
    out.push({ value: mode === 'buy' ? smaLow[i] : smaHigh[i], mode });
  }
  return out;
}

// ─── LWC RENDER — registra chart para render após modal entrar no DOM ────────────
const _lwcPendingCharts = [];
function _lwcRender(el, cb) {
  _lwcPendingCharts.push({ el, cb });
}
function _lwcFlush() {
  while (_lwcPendingCharts.length) {
    const { el, cb } = _lwcPendingCharts.shift();
    const w = el.getBoundingClientRect().width || el.offsetWidth || 320;
    cb(Math.floor(w));
  }
}

// ─── Marker responsivo para osciladores: encontra primeiro candle onde condição é satisfeita ─
function _findOscSignal(indData, val, cross, up) {
  if (cross) {
    // Cruza: encontrar ÚLTIMO cruzamento (mais ao centro/direita do gráfico)
    let last = -1;
    for (let i = 1; i < indData.length; i++) {
      const prev = indData[i-1].value, curr = indData[i].value;
      if (up && prev <= val && curr > val) last = i;
      if (!up && prev >= val && curr < val) last = i;
    }
    return last;
  }
  // Está acima/abaixo: encontrar candle MAIS PRÓXIMO do threshold no lado correto
  // (demonstra visualmente onde o indicador está na zona certa)
  let bestIdx = -1, bestDist = Infinity;
  for (let i = 0; i < indData.length; i++) {
    const curr = indData[i].value;
    const ok = up ? curr > val : curr < val;
    if (ok) {
      const dist = Math.abs(curr - val);
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
  }
  return bestIdx;
}
function _applyOscSignalMarker(cs, lineSeries, indData, times, val, cross, up) {
  const idx = _findOscSignal(indData, val, cross, up);
  if (idx < 0) return;
  const sigPoint = indData[idx];
  const candleIdx = times.indexOf(sigPoint.time);
  if (candleIdx >= 0) {
    cs.setMarkers([{ time: times[candleIdx], position: up ? 'aboveBar' : 'belowBar', color: up ? '#10B981' : '#EF4444', shape: up ? 'arrowUp' : 'arrowDown', text: 'Sinal' }]);
  }
  lineSeries.setMarkers([{ time: sigPoint.time, position: up ? 'belowBar' : 'aboveBar', color: up ? '#10B981' : '#EF4444', shape: 'circle', size: 1 }]);
}

// ─── LIGHTWEIGHT CHARTS CONDITION PREVIEW ─────────────────────────────────────
function buildCondPreview(indId, condText, params={}) {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const ct = (condText || '').toLowerCase();
  const up = ct.includes('acima') || ct.includes('sup') || ct.includes('alta') || ct.includes('subindo') || ct.includes('compra') || ct.includes('maior');
  const cross = ct.includes('cruza') || ct.includes('rompe');
  const sc = up ? '#10B981' : '#EF4444';

  // Indicator types that get LWC treatment
  const LWC_IDS = ['rsi','stoch','cci','williams','macd','atr','sma','ema','bb','vwap','adx','sar','hilo','hilon','range','gap','prevday','fib','fvg','bos','choch','sweep','grab','candle'];

  if (!LWC_IDS.includes(indId)) {
    return _buildCondPreviewSVG(indId, condText, params, isDark, up, cross, sc, ct);
  }

  // ── LIGHTWEIGHT CHARTS ──────────────────────────────────────
  const container = document.createElement('div');
  container.className = 'cond-preview-chart';

  // Colors
  const bg   = isDark ? '#12121A' : '#F5F5F0';
  const grid = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.06)';
  const text = isDark ? '#8888A0' : '#999999';
  const wick = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';

  // N dinâmico para osciladores: garante ~45 pontos válidos independente do período
  // Para outros indicadores N=60 fixo (suficiente)
  const _isOsc = ['rsi','stoch','cci','williams','atr'].includes(indId);
  const _oscPer = _isOsc ? (params.per || 14) : 0;
  const N = _oscPer > 0 ? Math.max(60, _oscPer + 45) : 60;
  const _p1 = Math.floor(N / 3);
  const _p2 = Math.floor(2 * N / 3);
  const closes = (() => {
    let s = 77;
    const rng = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
    const prices = [100];
    for (let i = 1; i < N; i++) {
      // Três fases proporcionais a N: alta → queda → alta
      // Garante que RSI cubra zonas de sobrevenda (<30) e sobrecompra (>70)
      let trend;
      if (i < _p1) trend = 1.5;
      else if (i < _p2) trend = -1.6;
      else trend = 1.4;
      const noise = (rng() - 0.5) * 3;
      const osc = Math.sin(i * 0.8) * 1.5;
      prices.push(+(prices[i-1] + trend + noise + osc).toFixed(2));
    }
    return prices;
  })();

  let seed2 = 12345;
  const rng2 = () => { seed2 = (seed2 * 1664525 + 1013904223) & 0xffffffff; return (seed2 >>> 0) / 0xffffffff; };
  const t0 = new Date('2024-01-02').getTime();
  const barSecs = 5 * 60;

  // Dataset alternativo para crossover de MAs — tendência V garantindo cruzamento
  // visível no meio do gráfico (usado SOMENTE quando isCross=true em SMA/EMA)
  const _crossCloses = (() => {
    const arr = [];
    // Tendência: alta dos 0-22, baixa dos 22-44, alta dos 44-60 — cruzamento bem no meio
    for (let i = 0; i < N; i++) {
      let v;
      if (i < 22) v = 100 + i * 1.2;
      else if (i < 44) v = 100 + 22*1.2 - (i - 22) * 1.6;
      else v = 100 + 22*1.2 - 22*1.6 + (i - 44) * 1.4;
      v += (((i * 17 + 7) % 13) - 6) * 0.4;
      arr.push(+v.toFixed(2));
    }
    return arr;
  })();
  const _crossOhlc = _crossCloses.map((c, i) => {
    const prev = i > 0 ? _crossCloses[i-1] : c;
    const o = prev, cl = c;
    const body = Math.abs(cl - o);
    const shadow = Math.max(body * 0.4, 1.5) + ((i * 13) % 7) * 0.4;
    return { time: Math.floor(t0/1000) + i * barSecs, open: +o.toFixed(2), high: +(Math.max(o,cl)+shadow).toFixed(2), low: +(Math.min(o,cl)-shadow).toFixed(2), close: +cl.toFixed(2) };
  });
  const ohlc = closes.map((c, i) => {
    const prev = i > 0 ? closes[i-1] : c;
    const o = prev, cl = c;
    const body = Math.abs(cl - o);
    const shadow = Math.max(body * 0.4, 1.5) + rng2() * 3; // shadow proporcional ao body
    const hi = Math.max(o, cl) + shadow;
    const lo = Math.min(o, cl) - shadow;
    return { time: Math.floor(t0/1000) + i * barSecs, open: +o.toFixed(2), high: +hi.toFixed(2), low: +lo.toFixed(2), close: +cl.toFixed(2) };
  });
  const highs  = ohlc.map(b => b.high);
  const lows   = ohlc.map(b => b.low);
  const times  = ohlc.map(b => b.time);

  // ── OSCILLATOR PANELS (rsi, stoch, cci, williams, atr) ──────
  if (['rsi','stoch','cci','williams','atr'].includes(indId)) {
    // split layout: top=candles (55%), bottom=indicator (45%)
    container.style.height = '210px';
    container.style.display = 'flex';
    container.style.flexDirection = 'column';

    // --- Candle chart (top) ---
    const topDiv = document.createElement('div');
    topDiv.style.cssText = 'flex:0 0 120px;overflow:hidden;border-radius:10px 10px 0 0';
    container.appendChild(topDiv);

    const divider = document.createElement('div');
    divider.style.cssText = `height:1px;background:${grid}`;
    container.appendChild(divider);

    // --- Indicator chart (bottom) ---
    const botDiv = document.createElement('div');
    botDiv.style.cssText = 'flex:1;overflow:hidden;border-radius:0 0 10px 10px';
    container.appendChild(botDiv);

    // Create charts after DOM is appended (needs dimensions)
    _lwcRender(container, (chartW) => {
      if (!window.LightweightCharts) { container.appendChild(_buildCondPreviewSVG(indId, condText, params, isDark, up, cross, sc, ct)); return; }

const chartOpts = {
        width: chartW,
        layout: { background: { color: bg }, textColor: text },
        grid: { vertLines: { color: grid }, horzLines: { color: grid } },
        rightPriceScale: { borderColor: 'transparent', scaleMargins: { top: 0.08, bottom: 0.08 } },
        timeScale: { borderColor: 'transparent', visible: false },
        crosshair: { mode: 1 },
        handleScroll: false, handleScale: false,
      };

      // Top: candles
      const topChart = LightweightCharts.createChart(topDiv, { ...chartOpts, height: 120 });
      const cs = topChart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      priceLineVisible:false,lastValueVisible:false,
      });
      cs.setData(ohlc);
      const sigIdx = N - 3;  // fallback, cada indicador pode sobrescrever via cs.setMarkers
      topChart.timeScale().fitContent();

      // Bottom: indicator — width explícito do topDiv (já renderizado), height fixo
      const botW = topDiv.offsetWidth || chartW;
      const botChart = LightweightCharts.createChart(botDiv, {
        width: botW,
        height: 88,
        layout: { background: { color: bg }, textColor: text },
        grid: { vertLines: { color: grid }, horzLines: { color: grid } },
        rightPriceScale: { borderColor: 'transparent', scaleMargins: { top: 0.1, bottom: 0.1 } },

      // ---- Trap Alta (Bull Trap)

      }else if(ctL.includes('trap')&&(ctL.includes('baixa')||ctL.includes('bear'))){

      // ---- Generic Doji (fallback for any doji variant)
      }else{

            bk(3,105,107,103,106),bk(4,106,108,104,107),

      }

      if(pd){
        cs.setData(pd);
        if(mi!=null)cs.setMarkers([{time:pd[mi].time,position:mkPos||'belowBar',color:mc||'#F0A020',shape:'circle',text:lbl||ct}]);
        chart.timeScale().fitContent();
      }
    });
    return container;
  }

  // Fallback to SVG for everything else
  return _buildCondPreviewSVG(indId, condText, params, isDark, up, cross, sc, ct);
}

function _buildCondPreviewSVG(indId, condText, params={}, isDark, up, cross, sc, ct) {
  const W=280,H=120;
  const TH=svgTheme();
  const svg=hsvg('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`});
  svg.appendChild(hsvg('rect',{x:0,y:0,width:W,height:H,rx:6,fill:TH.bg}));
  const touch=ct.includes('toca');
  const ln=(x1,y1,x2,y2,c,w,d)=>{const a={x1,y1,x2,y2,stroke:c,'stroke-width':w||0.5};if(d)a['stroke-dasharray']=d;svg.appendChild(hsvg('line',a));};
  const pl=(p,c,w,d)=>{const a={points:p,fill:'none',stroke:c,'stroke-width':w||1};if(d)a['stroke-dasharray']=d;svg.appendChild(hsvg('polyline',a));};
  const rc=(x,y,w,h,c,o,r)=>svg.appendChild(hsvg('rect',{x,y,width:w,height:h,fill:c,'fill-opacity':o!=null?o:1,rx:r||0}));
  const ci=(x,y,c,r)=>svg.appendChild(hsvg('circle',{cx:x,cy:y,r:r||3,fill:c,'fill-opacity':0.2,stroke:c,'stroke-width':1}));
  const tx=(x,y,t,c,s,a)=>{const e=hsvg('text',{x,y,fill:c,'font-size':s||7,'font-family':'JetBrains Mono','font-weight':500,'text-anchor':a||'start'});e.textContent=t;svg.appendChild(e);};
  const pa=(d,c,o)=>svg.appendChild(hsvg('path',{d,fill:c,'fill-opacity':o||0.1}));
  const aw=(x,y,isUp,c)=>{const d=isUp?-1:1;ln(x,y+d*2,x,y+d*8,c,1);pl(`${x-2},${y+d*6} ${x},${y+d*9} ${x+2},${y+d*6}`,c,1);};
  const badge=(x,y,t,c,s,a)=>{const fs=s||7;const tw=t.length*(fs*0.56);const ax=a==='end'?x-tw-2:a==='middle'?x-tw/2-1:x-1;rc(ax,y-fs+1,tw+2,fs+2,TH.badgeBg,0.92,2);tx(x,y,t,c,fs,a);};
  // 16 thin candles
  const CDS=[];const n=16;const cw=5;const sp=(W-20)/n;
  const prices=[52,48,54,50,56,60,58,64,68,66,62,58,54,50,46,42];
  for(let i=0;i<n;i++){const o=prices[i],c=i<n-1?prices[i+1]:prices[i]-4;const hi=Math.min(o,c)-2-Math.random()*4;const lo=Math.max(o,c)+2+Math.random()*4;CDS.push({x:10+i*sp,o,c,h:hi,l:lo,w:cw});}
  const drawCds=(data,op)=>{data.forEach(cd=>{const bull=cd.c<cd.o;const col=bull?'#10B981':'#EF4444';ln(cd.x+cd.w/2,cd.h,cd.x+cd.w/2,cd.l,col,0.5);const top=Math.min(cd.o,cd.c),bh=Math.max(1,Math.abs(cd.o-cd.c));rc(cd.x,top,cd.w,bh,col,op!=null?op:0.8,0.5);});};
  // Grid
  for(let y=30;y<H;y+=30)ln(6,y,W-6,y,TH.grid,0.4);

  // ═══ OSCILLATORS ═══
  if(['rsi','stoch','cci','williams','adx','atr'].includes(indId)){
    const labels={rsi:'RSI',stoch:'STOCH',cci:'CCI',williams:'W%R',adx:'ADX',atr:'ATR'};
    // Position threshold proportionally to val
    const val=params.val!=null?params.val:(up?70:30);
    const isWide=['cci','williams'].includes(indId);
    const range=isWide?400:100;
    const min=isWide?-200:0;
    const frac=1-((val-min)/range);
    const threshY=Math.max(15,Math.min(H-15, 15+frac*(H-30)));
    ln(12,threshY,W-12,threshY,'#F59E0B',0.6,'3,3');
    tx(W-8,threshY-3,String(val),'#F59E0B',6,'end');
    const oscY=[];for(let i=0;i<n;i++){oscY.push(up?82-Math.sin((i/n)*Math.PI)*56:30+Math.sin((i/n)*Math.PI)*56);}
    pl(oscY.map((y,i)=>`${CDS[i].x+cw/2},${y}`).join(' '),'#6366F1',1.2);
    const si=Math.floor(n*0.6);
    if(cross||touch){ci(CDS[si].x+cw/2,oscY[si],sc,4);aw(CDS[si].x+cw/2+10,oscY[si],up,sc);}
    else{let d=`M${CDS[si].x+cw/2},${threshY}`;for(let i=si;i<n;i++)d+=` L${CDS[i].x+cw/2},${oscY[i]}`;d+=` L${CDS[n-1].x+cw/2},${threshY} Z`;pa(d,sc,0.15);}
    tx(10,14,labels[indId],TH.txm,8);
    return svg;
  }

  // ═══ MOVING AVERAGES ═══
  if(['sma','ema'].includes(indId)){
    drawCds(CDS,0.4);
    const maCrossover=ct.includes('longa')||ct.includes('cruzamento de médias');
    if(maCrossover){
      const isBoth=ct.includes('cruzamento de médias');
      const shortMA=CDS.map((_,i)=>{const mid=H/2;return mid+Math.cos((i-n/2)*0.4)*(H/2-12);});
      const longMA=CDS.map((_,i)=>{const mid=H/2+3;return mid+Math.sin((i-4)*0.1)*8;});
      pl(CDS.map((c,i)=>`${c.x+cw/2},${shortMA[i]}`).join(' '),'#00D4AA',1.2);
      pl(CDS.map((c,i)=>`${c.x+cw/2},${longMA[i]}`).join(' '),'#F59E0B',1.2,'3,3');
      let cx1=Math.floor(n/3);for(let i=1;i<n;i++){if((shortMA[i-1]-longMA[i-1])*(shortMA[i]-longMA[i])<=0){cx1=i;break;}}
      ci(CDS[cx1].x+cw/2,(shortMA[cx1]+longMA[cx1])/2,isBoth?'#10B981':sc,4);
      if(isBoth){let cx2=n-1;for(let i=cx1+2;i<n;i++){if((shortMA[i-1]-longMA[i-1])*(shortMA[i]-longMA[i])<=0){cx2=i;break;}}ci(CDS[cx2].x+cw/2,(shortMA[cx2]+longMA[cx2])/2,'#EF4444',4);}
      tx(10,14,'CURTA','#00D4AA',7);tx(52,14,'LONGA','#F59E0B',7);
    } else {
      drawCds(CDS,0.5);
      const maY=CDS.map((_,i)=>{const mid=H/2+5;return mid+Math.sin((i-3)*0.25)*18;});
      pl(CDS.map((c,i)=>`${c.x+cw/2},${maY[i]}`).join(' '),'#F59E0B',1.2);
      const si=Math.floor(n*0.55);
      if(cross){ci(CDS[si].x+cw/2,maY[si],sc,4);aw(CDS[si].x+cw/2+10,maY[si],up,sc);}
      else{const s=up?si:0,e=up?n-1:si;let d=`M${CDS[s].x+cw/2},${maY[s]}`;for(let i=s;i<=e;i++)d+=` L${CDS[i].x+cw/2},${(CDS[i].o+CDS[i].c)/2}`;d+=` L${CDS[e].x+cw/2},${maY[e]}`;for(let i=e;i>=s;i--)d+=` L${CDS[i].x+cw/2},${maY[i]}`;d+=' Z';pa(d,sc,0.12);}
      tx(10,14,indId.toUpperCase(),'#F59E0B',8);
    }
    return svg;
  }

  // ═══ BOLLINGER BANDS ═══
  if(indId==='bb'){
    drawCds(CDS,0.4);
    const dev=params.dev||2;
    const bw=5+dev*3.5; // dev 1→8.5, dev 2→12, dev 3→15.5
    const mid=CDS.map(c=>(c.o+c.c)/2);
    let bp=`M${CDS[0].x+cw/2},${mid[0]-bw}`;for(let i=1;i<n;i++)bp+=` L${CDS[i].x+cw/2},${mid[i]-bw}`;for(let i=n-1;i>=0;i--)bp+=` L${CDS[i].x+cw/2},${mid[i]+bw}`;bp+=' Z';
    pa(bp,'#6366F1',0.06);
    pl(CDS.map((c,i)=>`${c.x+cw/2},${mid[i]-bw}`).join(' '),'#6366F1',0.6,'2,2');
    pl(CDS.map((c,i)=>`${c.x+cw/2},${mid[i]+bw}`).join(' '),'#6366F1',0.6,'2,2');
    pl(CDS.map((c,i)=>`${c.x+cw/2},${mid[i]}`).join(' '),'#6366F1',0.5);
    const isUpper=ct.includes('sup');const si=8;const bandY=isUpper?mid[si]-bw:mid[si]+bw;
    ci(CDS[si].x+cw/2,bandY,sc,4);
    tx(10,14,`BOLLINGER (${dev}σ)`,'#6366F1',7);
    return svg;
  }

  // ═══ VWAP ═══
  if(indId==='vwap'){
    drawCds(CDS,0.4);
    const vwY=CDS.map((_,i)=>{const mid=H/2+4;return mid+Math.sin((i-2)*0.15)*10;});
    pl(CDS.map((c,i)=>`${c.x+cw/2},${vwY[i]}`).join(' '),'#F59E0B',1.2);
    const si=Math.floor(n*0.55);
    if(cross){ci(CDS[si].x+cw/2,vwY[si],sc,4);aw(CDS[si].x+cw/2+10,vwY[si],up,sc);}
    else{const s=up?si:0,e=up?n-1:si;let d=`M${CDS[s].x+cw/2},${vwY[s]}`;for(let i=s;i<=e;i++)d+=` L${CDS[i].x+cw/2},${(CDS[i].o+CDS[i].c)/2}`;d+=` L${CDS[e].x+cw/2},${vwY[e]}`;for(let i=e;i>=s;i--)d+=` L${CDS[i].x+cw/2},${vwY[i]}`;d+=' Z';pa(d,sc,0.12);}
    tx(10,14,'VWAP','#F59E0B',8);
    return svg;
  }

  // ═══ MACD ═══
  if(indId==='macd'){
    const zero=60;ln(12,zero,W-12,zero,'#2A2A3C',0.5);
    const hist=[];for(let i=0;i<n;i++)hist.push(Math.sin((i/n)*Math.PI*2-1)*18);
    const bw=(W-24)/n;
    hist.forEach((v,i)=>{const x=12+i*bw,hgt=Math.abs(v),y=v<0?zero:zero-hgt;rc(x,y,bw-1,hgt,v>=0?'#10B981':'#EF4444',0.5,0.5);});
    const macdY=hist.map(v=>zero-v*1.2);pl(macdY.map((y,i)=>`${12+i*bw+bw/2},${y}`).join(' '),'#00D4AA',1);
    const sigY=hist.map((v,i)=>zero-Math.sin(((i-1)/n)*Math.PI*2-1)*14);pl(sigY.map((y,i)=>`${12+i*bw+bw/2},${y}`).join(' '),'#EF4444',0.8,'2,2');
    const isZero=ct.includes('zero');
    if(!isZero){const si=Math.floor(n*0.4);ci(12+si*bw+bw/2,macdY[si],sc,4);}
    tx(10,14,'MACD','#00D4AA',8);tx(W-35,14,'Signal','#EF4444',6);
    return svg;
  }

  // ═══ SAR ═══
  if(indId==='sar'){
    drawCds(CDS,0.4);
    const flip=Math.floor(n/2);
    CDS.forEach((cd,i)=>{const above=i<flip;const dy=above?cd.h-4:cd.l+4;svg.appendChild(hsvg('circle',{cx:cd.x+cw/2,cy:dy,r:1.5,fill:above?'#EF4444':'#10B981'}));});
    if(cross){ci(CDS[flip].x+cw/2,CDS[flip].l+4,sc,4);}
    tx(10,14,'SAR','#F59E0B',8);
    return svg;
  }

  // ═══ HILO ═══
  if(indId==='hilo'){
    drawCds(CDS,0.4);
    const flip=Math.floor(n/2);
    for(let i=0;i<n;i++){const sell=i<flip;const y=sell?CDS[i].h-3:CDS[i].l+3;ln(CDS[i].x,y,CDS[i].x+cw,y,sell?'#EF4444':'#10B981',1);}
    ci(CDS[flip].x+cw/2,CDS[flip].l+3,sc,4);
    tx(10,14,'HILO','#F59E0B',8);
    return svg;
  }





  // ═══ RANGE ═══
  if(indId==='range'){
    const cds2=[];for(let i=0;i<8;i++){const o=40+Math.random()*30,c=40+Math.random()*30,hi=Math.min(o,c)-3-Math.random()*8,lo=Math.max(o,c)+3+Math.random()*8;cds2.push({x:20+i*32,o,c,h:hi,l:lo,w:6});}
    drawCds(cds2,0.5);
    const tgt=up?2:5;const mx=cds2[tgt].x+cds2[tgt].w+3;
    ln(mx,cds2[tgt].h,mx,cds2[tgt].l,'#F59E0B',0.8);ln(mx-2,cds2[tgt].h,mx+2,cds2[tgt].h,'#F59E0B',0.6);ln(mx-2,cds2[tgt].l,mx+2,cds2[tgt].l,'#F59E0B',0.6);
    tx(10,14,'RANGE',TH.txm,8);
    return svg;
  }

  // ═══ HILON ═══
  if(indId==='hilon'){
    drawCds(CDS,0.4);const isMax=up;
    const lY=isMax?Math.min(...CDS.slice(0,10).map(c=>c.h)):Math.max(...CDS.slice(0,10).map(c=>c.l));
    ln(CDS[0].x,lY,CDS[10].x+cw,lY,sc,0.8,'3,3');
    ci(CDS[10].x+cw/2,lY,sc,4);
    tx(10,14,'MÁX/MÍN N',TH.txm,8);
    return svg;
  }

  // ═══ GAP ═══
  if(indId==='gap'){
    const pre=[];for(let i=0;i<4;i++){const o=50+i*5,c=52+i*5;pre.push({x:15+i*18,o,c,h:o-3,l:c+3,w:5});}
    drawCds(pre,0.5);
    if(up){const post=[];for(let i=0;i<4;i++){const o=40-i*4,c=38-i*4;post.push({x:130+i*18,o,c,h:o-3,l:c+3,w:5});}drawCds(post,0.5);rc(100,40,28,24,'#10B981',0.08,3);tx(114,54,'GAP','#10B981',7,'middle');}
    else{const post=[];for(let i=0;i<4;i++){const o=80+i*4,c=82+i*4;post.push({x:130+i*18,o,c,h:o-3,l:c+3,w:5});}drawCds(post,0.5);rc(100,64,28,20,'#EF4444',0.08,3);tx(114,76,'GAP','#EF4444',7,'middle');}
    tx(10,14,'GAP',TH.txm,8);
    return svg;
  }

  // ═══ PREVDAY ═══
  if(indId==='prevday'){
    drawCds(CDS,0.4);const maxY=25,minY=95;
    ln(10,maxY,W-10,maxY,'#10B981',0.6,'3,3');ln(10,minY,W-10,minY,'#EF4444',0.6,'3,3');
    tx(W-8,maxY-2,'MÁX','#10B981',6,'end');tx(W-8,minY+8,'MÍN','#EF4444',6,'end');
    tx(10,14,'DIA ANT',TH.txm,8);
    return svg;
  }

  // ═══ FIBONACCI ═══
  if(indId==='fib'){
    // Extrai nível selecionado do texto da condição
    const fibLevels=[
      {p:'23.6',f:0.236},{p:'38.2',f:0.382},{p:'50',f:0.5},
      {p:'61.8',f:0.618},{p:'78.6',f:0.786},{p:'100',f:1.0}
    ];

    // ── Fundo (pivot ZigZag) ──

    ln(fundoX+3,fundoY-12,fundoX+3,fundoY+2,'#10B981',0.6);

    const bullCds=[

  if(indId==='sweep'){

    drawCds([sweepCd],0.8);

  // ═══ FALLBACK ═══
  drawCds(CDS,0.4);ci(CDS[10].x+cw/2,60,sc,4);tx(10,14,indId.toUpperCase(),TH.txm,8);
  return svg;
}

// ─── VALIDATION ENGINE ────────────────────────────────────────
const OSC_IDS        = ['rsi','stoch','macd','cci','williams'];
const MA_IDS         = ['sma','ema'];
const TREND_IDS      = ['sma','ema','bb','vwap','adx','sar','hilo'];
const CANDLE_IDS     = ['candle'];
const SMARTMONEY_IDS = ['fvg','bos','choch','sweep','grab'];

function oscZone(id, cond, val) {
  if (!OSC_IDS.includes(id)) return null;
  const mid = (id==='rsi'||id==='stoch') ? 50 : (id==='cci' ? 0 : -50);
  if (cond==='cruza acima de'||cond==='está acima de') return val <= mid ? 'sobrevenda' : 'sobrecompra';
  if (cond==='cruza abaixo de'||cond==='está abaixo de') return val >= mid ? 'sobrecompra' : 'sobrevenda';
  return null;
}

function validateNewCondition(newCond, existingConds) {
  const issues = [];
  const p = newCond.params, id = newCond.id;

  // R27-R31: Valores inválidos
  if ((id==='rsi'||id==='stoch') && p.val!=null && (p.val<0||p.val>100))
    issues.push({type:'block',rule:'R27',msg:'Este oscilador opera entre 0 e 100.'});
  if (id==='williams' && p.val!=null && (p.val<-100||p.val>0))
    issues.push({type:'block',rule:'R29',msg:'O Williams %R opera entre -100 e 0.'});
  if (id==='cci' && p.val!=null && Math.abs(p.val)>300)
    issues.push({type:'warn',rule:'R30',msg:'Valores de CCI nesta faixa são muito raros. O backtest pode não encontrar sinais suficientes no histórico.'});
  if (id==='range' && p.val!=null && p.val<=0)
    issues.push({type:'block',rule:'R31',msg:'O valor de referência deve ser maior que zero.'});

  // R44-R47: CROSS em extremos de range — condição matematicamente impossível
  // RSI e Estocástico: range 0-100
  if ((id==='rsi'||id==='stoch') && p.val!=null) {
    if (p.cond==='cruza acima de' && p.val<=0)
      issues.push({type:'block',rule:'R44',msg:'Cruzar acima de 0 é impossível — este oscilador nunca fica abaixo de 0.'});
    if (p.cond==='cruza abaixo de' && p.val>=100)
      issues.push({type:'block',rule:'R45',msg:'Cruzar abaixo de 100 é impossível — este oscilador nunca ultrapassa 100.'});
    if (p.cond==='cruza acima de' && p.val>=100)
      issues.push({type:'block',rule:'R44',msg:'Cruzar acima de 100 é impossível — este oscilador nunca ultrapassa 100.'});
    if (p.cond==='cruza abaixo de' && p.val<=0)
      issues.push({type:'block',rule:'R45',msg:'Cruzar abaixo de 0 é impossível — este oscilador nunca fica abaixo de 0.'});
  }
  // Williams %R: range -100 a 0
  if (id==='williams' && p.val!=null) {
    if (p.cond==='cruza acima de' && p.val>=0)
      issues.push({type:'block',rule:'R46',msg:'Cruzar acima de 0 é impossível — o Williams %R nunca ultrapassa 0.'});
    if (p.cond==='cruza abaixo de' && p.val<=-100)
      issues.push({type:'block',rule:'R46',msg:'Cruzar abaixo de -100 é impossível — o Williams %R nunca fica abaixo de -100.'});
    if (p.cond==='cruza abaixo de' && p.val>=0)
      issues.push({type:'block',rule:'R46',msg:'Cruzar abaixo de 0 é impossível — o Williams %R nunca ultrapassa 0.'});
    if (p.cond==='cruza acima de' && p.val<=-100)
      issues.push({type:'block',rule:'R46',msg:'Cruzar acima de -100 é impossível — o Williams %R nunca fica abaixo de -100.'});
  }
  // ADX: range 0-100
  if (id==='adx' && p.val!=null) {
    if (p.cond==='cruza acima de' && p.val<=0)
      issues.push({type:'block',rule:'R47',msg:'Cruzar acima de 0 é impossível — o ADX nunca fica abaixo de 0.'});
    if (p.cond==='cruza abaixo de' && p.val>=100)
      issues.push({type:'block',rule:'R47',msg:'Cruzar abaixo de 100 é impossível — o ADX nunca ultrapassa 100.'});
    if (p.cond==='cruza acima de' && p.val>=100)
      issues.push({type:'block',rule:'R47',msg:'Cruzar acima de 100 é impossível — o ADX nunca ultrapassa 100.'});
    if (p.cond==='cruza abaixo de' && p.val<=0)
      issues.push({type:'block',rule:'R47',msg:'Cruzar abaixo de 0 é impossível — o ADX nunca fica abaixo de 0.'});
  }

  // R48: Bollinger período mínimo 6
  if (id==='bb' && p.per!=null && p.per < 6)
    issues.push({type:'block',rule:'R48',msg:'O período mínimo das Bandas de Bollinger é 6. Com períodos menores as bandas recalculam rápido demais e o preço raramente fecha fora delas.'});

  // R26: 4+ condições simultâneas
  if (existingConds.length >= 3)
    issues.push({type:'warn',rule:'R26',msg:'Com 4 ou mais condições simultâneas, o número de sinais pode ser insuficiente para análise estatística confiável.'});

  // R40: Osciladores — máximo 1 por backtest
  if (OSC_IDS.includes(id)) {
    const existingOsc = existingConds.filter(c => OSC_IDS.includes(c.id));
    if (existingOsc.length >= 1)
      issues.push({type:'block',rule:'R40',msg:'Limite de 1 oscilador por backtest. Remova o oscilador existente para adicionar outro.'});
  }

  // R41: Tendência — máximo 2 (ou 3 se forem apenas médias SMA/EMA)
  if (TREND_IDS.includes(id)) {
    const existingTrend = existingConds.filter(c => TREND_IDS.includes(c.id));
    const newIsMa = MA_IDS.includes(id);
    const allAreMa = existingTrend.every(c => MA_IDS.includes(c.id));
    const limit = (newIsMa && allAreMa) ? 3 : 2;
    if (existingTrend.length >= limit) {
      if (limit === 3)
        issues.push({type:'block',rule:'R41',msg:'Limite de 3 médias móveis por backtest atingido.'});
      else
        issues.push({type:'block',rule:'R41',msg:'Limite de 2 indicadores de tendência por backtest. Para adicionar 3, use apenas médias móveis (SMA/EMA).'});
    }
  }

  // R42: Padrões de Candle — máximo 1 por backtest
  if (CANDLE_IDS.includes(id)) {
    const existingCandle = existingConds.filter(c => CANDLE_IDS.includes(c.id));
    if (existingCandle.length >= 1)
      issues.push({type:'block',rule:'R42',msg:'Limite de 1 padrão de candle por backtest. Remova o padrão existente para adicionar outro.'});
  }

  // R43: Smart Money — máximo 1 por backtest
  if (SMARTMONEY_IDS.includes(id)) {
    const existingSM = existingConds.filter(c => SMARTMONEY_IDS.includes(c.id));
    if (existingSM.length >= 1)
      issues.push({type:'block',rule:'R43',msg:'Limite de 1 conceito Smart Money por backtest. Remova o existente para adicionar outro.'});
  }

  for (const ex of existingConds) {
    const ep = ex.params;

    // R01: Condição idêntica
    if (id===ex.id && JSON.stringify(p)===JSON.stringify(ep))
      { issues.push({type:'block',rule:'R01',msg:'Esta condição já foi adicionada.'}); continue; }

    // R02-R04: Osciladores
    if (OSC_IDS.includes(id) && id===ex.id && p.per===ep.per) {
      if (p.cond==='está acima de' && ep.cond==='está abaixo de' && ep.val<=p.val)
        issues.push({type:'block',rule:'R02',msg:`${newCond.name}(${p.per}) não pode estar acima de ${p.val} e abaixo de ${ep.val} ao mesmo tempo.`});
      if (p.cond==='está abaixo de' && ep.cond==='está acima de' && p.val<=ep.val)
        issues.push({type:'block',rule:'R02',msg:`${newCond.name}(${p.per}) não pode estar abaixo de ${p.val} e acima de ${ep.val} ao mesmo tempo.`});
      if ((p.cond==='cruza acima de'&&ep.cond==='cruza abaixo de')||(p.cond==='cruza abaixo de'&&ep.cond==='cruza acima de'))
        issues.push({type:'block',rule:'R03',msg:`${newCond.name}(${p.per}) não pode cruzar para cima e para baixo no mesmo candle.`});
      if (p.cond==='cruza acima de' && ep.cond==='está abaixo de' && ep.val<=p.val)
        issues.push({type:'block',rule:'R04',msg:`Se ${newCond.name}(${p.per}) cruzou acima de ${p.val}, não pode estar abaixo de ${ep.val}.`});
      if (p.cond==='está abaixo de' && ep.cond==='cruza acima de' && p.val<=ep.val)
        issues.push({type:'block',rule:'R04',msg:`Se ${newCond.name}(${p.per}) cruzou acima de ${ep.val}, não pode estar abaixo de ${p.val}.`});
      if (p.cond==='cruza abaixo de' && ep.cond==='está acima de' && ep.val>=p.val)
        issues.push({type:'block',rule:'R04',msg:`Se ${newCond.name}(${p.per}) cruzou abaixo de ${p.val}, não pode estar acima de ${ep.val}.`});
      if (p.cond==='está acima de' && ep.cond==='cruza abaixo de' && p.val>=ep.val)
        issues.push({type:'block',rule:'R04',msg:`Se ${newCond.name}(${p.per}) cruzou abaixo de ${ep.val}, não pode estar acima de ${p.val}.`});
    }

    // R05-R07, R19, R22: Médias móveis
    if (MA_IDS.includes(id) && MA_IDS.includes(ex.id)) {
      if (id===ex.id && p.per===ep.per && !p.per2 && !ep.per2) {
        if ((p.cond==='Preço está acima'&&ep.cond==='Preço está abaixo')||(p.cond==='Preço está abaixo'&&ep.cond==='Preço está acima'))
          issues.push({type:'block',rule:'R05',msg:`Preço não pode estar acima e abaixo da ${id.toUpperCase()}(${p.per}) ao mesmo tempo.`});
        if ((p.cond==='Preço cruza acima'&&ep.cond==='Preço cruza abaixo')||(p.cond==='Preço cruza abaixo'&&ep.cond==='Preço cruza acima'))
          issues.push({type:'block',rule:'R06',msg:`Preço não pode cruzar a ${id.toUpperCase()}(${p.per}) para cima e para baixo no mesmo candle.`});
        if ((p.cond==='Preço cruza acima'&&ep.cond==='Preço está abaixo')||(p.cond==='Preço está abaixo'&&ep.cond==='Preço cruza acima'))
          issues.push({type:'block',rule:'R07',msg:`Se o preço cruzou acima da ${id.toUpperCase()}(${p.per}), por definição está acima dela.`});
        if ((p.cond==='Preço cruza abaixo'&&ep.cond==='Preço está acima')||(p.cond==='Preço está acima'&&ep.cond==='Preço cruza abaixo'))
          issues.push({type:'block',rule:'R07',msg:`Se o preço cruzou abaixo da ${id.toUpperCase()}(${p.per}), por definição está abaixo dela.`});
      }
      if (id===ex.id && p.per!==ep.per && !p.per2 && !ep.per2 && Math.abs((p.per||200)-(ep.per||200))<10)
        issues.push({type:'warn',rule:'R22',msg:`${id.toUpperCase()}(${p.per}) e ${ex.id.toUpperCase()}(${ep.per}) têm períodos muito próximos e produzem resultados quase idênticos.`});
      if (id!==ex.id && (p.per||200)===(ep.per||200) && p.cond===ep.cond && !p.per2 && !ep.per2)
        issues.push({type:'warn',rule:'R19',msg:`SMA e EMA com mesmo período e condição produzem sinais quase idênticos. Considere usar apenas uma.`});
    }

    // R49: MA mesmo indicador + mesmo período + condições incoerentes ou impossíveis
    if (MA_IDS.includes(id) && MA_IDS.includes(ex.id) && id===ex.id && p.per===ep.per && !p.per2 && !ep.per2) {
      // IMPOSSÍVEL: cruza acima da longa e cruza abaixo da longa no mesmo candle
      if ((p.cond==='Média curta cruza acima da longa'&&ep.cond==='Média curta cruza abaixo da longa')||
          (p.cond==='Média curta cruza abaixo da longa'&&ep.cond==='Média curta cruza acima da longa'))
        issues.push({type:'block',rule:'R49',msg:`A média curta não pode cruzar para cima e para baixo da ${id.toUpperCase()}(${p.per}) no mesmo candle.`});
      // INCOERENTE: direções opostas — preço cruzando acima + média cruzando abaixo
      if ((p.cond==='Preço cruza acima'&&ep.cond==='Média curta cruza abaixo da longa')||
          (p.cond==='Média curta cruza abaixo da longa'&&ep.cond==='Preço cruza acima'))
        issues.push({type:'block',rule:'R49',msg:`Preço cruzando acima e média cruzando abaixo da ${id.toUpperCase()}(${p.per}) são condições contraditórias.`});
      // INCOERENTE: direções opostas — preço cruzando abaixo + média cruzando acima
      if ((p.cond==='Preço cruza abaixo'&&ep.cond==='Média curta cruza acima da longa')||
          (p.cond==='Média curta cruza acima da longa'&&ep.cond==='Preço cruza abaixo'))
        issues.push({type:'block',rule:'R49',msg:`Preço cruzando abaixo e média cruzando acima da ${id.toUpperCase()}(${p.per}) são condições contraditórias.`});
      // INCOERENTE: preço está acima + média cruzando abaixo (sinais opostos)
      if ((p.cond==='Preço está acima'&&ep.cond==='Média curta cruza abaixo da longa')||
          (p.cond==='Média curta cruza abaixo da longa'&&ep.cond==='Preço está acima'))
        issues.push({type:'block',rule:'R49',msg:`Preço acima (tendência de alta) e média cruzando abaixo (sinal de baixa) da ${id.toUpperCase()}(${p.per}) são condições contraditórias.`});
      // INCOERENTE: preço está abaixo + média cruzando acima (sinais opostos)
      if ((p.cond==='Preço está abaixo'&&ep.cond==='Média curta cruza acima da longa')||
          (p.cond==='Média curta cruza acima da longa'&&ep.cond==='Preço está abaixo'))
        issues.push({type:'block',rule:'R49',msg:`Preço abaixo (tendência de baixa) e média cruzando acima (sinal de alta) da ${id.toUpperCase()}(${p.per}) são condições contraditórias.`});
      // INCOERENTE: preço cruza acima + MA_CROSS com mesmo período (mistura de comparações)
      if ((p.cond==='Preço cruza acima'&&ep.cond==='Média curta cruza acima da longa')||
          (p.cond==='Média curta cruza acima da longa'&&ep.cond==='Preço cruza acima'))
        issues.push({type:'block',rule:'R49',msg:`Não é possível comparar preço vs ${id.toUpperCase()} e média vs média usando o mesmo período (${p.per}).`});
      if ((p.cond==='Preço cruza abaixo'&&ep.cond==='Média curta cruza abaixo da longa')||
          (p.cond==='Média curta cruza abaixo da longa'&&ep.cond==='Preço cruza abaixo'))
        issues.push({type:'block',rule:'R49',msg:`Não é possível comparar preço vs ${id.toUpperCase()} e média vs média usando o mesmo período (${p.per}).`});
      // INCOERENTE: bidirecional (compra e venda) + qualquer condição direcional com mesmo período
      const bidir = 'Cruzamento de médias (compra e venda)';
      const dirConds = ['Preço cruza acima','Preço cruza abaixo','Preço está acima','Preço está abaixo',
                        'Média curta cruza acima da longa','Média curta cruza abaixo da longa'];
      if ((p.cond===bidir && dirConds.includes(ep.cond))||(ep.cond===bidir && dirConds.includes(p.cond)))
        issues.push({type:'block',rule:'R49',msg:`'Cruzamento de médias (compra e venda)' não pode ser combinado com condição direcional da ${id.toUpperCase()}(${p.per}) — use períodos diferentes.`});
    }

    // R08-R10: VWAP
    if (id==='vwap' && ex.id==='vwap') {
      if ((p.cond==='Preço está acima do VWAP'&&ep.cond==='Preço está abaixo do VWAP')||(p.cond==='Preço está abaixo do VWAP'&&ep.cond==='Preço está acima do VWAP'))
        issues.push({type:'block',rule:'R08',msg:'Preço não pode estar acima e abaixo do VWAP ao mesmo tempo.'});
      if ((p.cond==='Preço cruza acima do VWAP'&&ep.cond==='Preço cruza abaixo do VWAP')||(p.cond==='Preço cruza abaixo do VWAP'&&ep.cond==='Preço cruza acima do VWAP'))
        issues.push({type:'block',rule:'R09',msg:'Preço não pode cruzar o VWAP para cima e para baixo no mesmo candle.'});
      if ((p.cond==='Preço cruza acima do VWAP'&&ep.cond==='Preço está abaixo do VWAP')||(p.cond==='Preço está abaixo do VWAP'&&ep.cond==='Preço cruza acima do VWAP'))
        issues.push({type:'block',rule:'R10',msg:'Se o preço cruzou acima do VWAP, por definição está acima dele.'});
      if ((p.cond==='Preço cruza abaixo do VWAP'&&ep.cond==='Preço está acima do VWAP')||(p.cond==='Preço está acima do VWAP'&&ep.cond==='Preço cruza abaixo do VWAP'))
        issues.push({type:'block',rule:'R10',msg:'Se o preço cruzou abaixo do VWAP, por definição está abaixo dele.'});
    }

    // R11: MACD
    if (id==='macd' && ex.id==='macd') {
      if ((p.cond==='MACD cruza acima do sinal'&&ep.cond==='MACD cruza abaixo do sinal')||(p.cond==='MACD cruza abaixo do sinal'&&ep.cond==='MACD cruza acima do sinal'))
        issues.push({type:'block',rule:'R11',msg:'MACD não pode cruzar o sinal para cima e para baixo no mesmo candle.'});
      if ((p.cond==='MACD acima de zero'&&ep.cond==='MACD abaixo de zero')||(p.cond==='MACD abaixo de zero'&&ep.cond==='MACD acima de zero'))
        issues.push({type:'block',rule:'R11',msg:'MACD não pode estar acima e abaixo de zero ao mesmo tempo.'});
    }



    // R14: Range
    if (id==='range' && ex.id==='range') {
      if ((p.cond==='é maior que'&&ep.cond==='é menor que'&&ep.val<=p.val)||(p.cond==='é menor que'&&ep.cond==='é maior que'&&p.val<=ep.val))
        issues.push({type:'block',rule:'R14',msg:`Range não pode ser maior que ${Math.max(p.val,ep.val)} e menor que ${Math.min(p.val,ep.val)} ao mesmo tempo.`});
    }

    // R18: Bollinger bandas opostas
    if (id==='bb' && ex.id==='bb' && (p.per||20)===(ep.per||20)) {
      const sup=['Preço toca banda superior','Preço cruza banda superior'];
      const inf=['Preço toca banda inferior','Preço cruza banda inferior'];
      if ((sup.includes(p.cond)&&inf.includes(ep.cond))||(inf.includes(p.cond)&&sup.includes(ep.cond)))
        issues.push({type:'block',rule:'R18',msg:'Banda superior e inferior ao mesmo tempo não define um setup claro. Separe em condições distintas.'});
    }
  }

  // R20/R21 removidas: substituídas pela R40 (limite de 1 oscilador por backtest)

  // R24: Cruzamento + posição incompatível
  if (OSC_IDS.includes(id) && p.cond==='está acima de') {
    existingConds.filter(c=>c.id===id&&c.params.per===p.per&&c.params.cond==='cruza acima de').forEach(cross=>{
      if (p.val > cross.params.val + 20)
        issues.push({type:'warn',rule:'R24',msg:`'Cruzar acima de ${cross.params.val}' e 'estar acima de ${p.val}' raramente ocorrem no mesmo candle. O backtest pode gerar pouquíssimos sinais.`});
    });
  }

  return issues;
}

function validateExitCondition(exitCond, entryConds) {
  for (const ec of entryConds) {
    if (exitCond.id===ec.id && JSON.stringify(exitCond.params)===JSON.stringify(ec.params))
      return [{type:'block',rule:'R32',msg:'A condição de saída não pode ser idêntica a uma condição de entrada.'}];
  }
  return [];
}

function validateStep1(cfg) {
  const issues = [];
  if (cfg.tStart >= cfg.tEnd)
    issues.push({type:'block',rule:'R34',msg:'O horário de início deve ser anterior ao horário de fim.'});
  const tfMin={'1m':1,'2m':2,'5m':5,'10m':10,'15m':15,'30m':30,'60m':60,'D':480};
  const [sh,sm]=cfg.tStart.split(':').map(Number);
  const [lh,lm]=cfg.tLastEntry.split(':').map(Number);
  const win=(lh*60+lm)-(sh*60+sm);
  if (win>0 && tfMin[cfg.tf] && win<tfMin[cfg.tf])
    issues.push({type:'block',rule:'R35',msg:`A janela de leitura (${win} min) é menor que o timeframe selecionado (${cfg.tf}). Nenhum candle completo caberá neste período. Aumente a janela ou reduza o timeframe.`});
  return issues;
}

function renderIssues(issues) {
  const wrap = div('');
  issues.forEach(issue => {
    const el = div('');
    el.style.cssText = `display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:8px;margin-top:7px;font-size:12px;line-height:1.5;${
      issue.type==='block'
        ? 'background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#EF4444'
        : 'background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:#F59E0B'
    }`;
    const icEl = div('');icEl.style.cssText='flex-shrink:0;margin-top:1px';
    icEl.innerHTML = issue.type==='block'
      ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`
      : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>`;
    const txt = div('');txt.textContent = issue.msg;
    el.append(icEl,txt);wrap.appendChild(el);
  });
  return wrap;
}

let modalWarnOverride = false;

}

  // Body
  const body=div('modal-body');

  if(ms.page===0) {

          if(['sma','ema'].includes(ind.id)){ ms.params.per=200; }
          if(ind.id==='bb'){ ms.params.per=20; ms.params.dev=2; }

          if(ind.id==='bos')  ms.params={dir:'Compra',obMit:'none',leg1Min:2,leg1Max:5,corrMax:3,leg2Max:3,cond:BOS_CONDS[0]};
          if(ind.id==='choch')ms.params={dir:'Compra',obMit:'none',trendMin:5,trendMax:15,ampRatio:40,cond:CHOCH_CONDS[0]};

      const desc=div('');desc.style.cssText='font-size:13px;color:var(--txs);margin-bottom:4px';
      desc.textContent=`Como você quer usar a ${ind.name}?`;

      // Filter card

            });
            const _st0=Math.floor(new Date('2024-01-02').getTime()/1000),_sBS=86400;

            const _sd=[

              {time:_st0+1*_sBS,open:105,high:107,low:103,close:104},

            sChart.addLineSeries({color:'#F59E0B',lineWidth:1.5,lineStyle:1,priceLineVisible:false,lastValueVisible:false}).setData(_sd.slice(0,8).map(b=>({time:b.time,value:_sLvl})));
            const sCs=sChart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'rgba(38,166,154,0.7)',wickDownColor:'rgba(239,83,80,0.7)',priceLineVisible:false,lastValueVisible:false});
            sCs.setData(_sd);

            const _sap=_sd.flatMap(c=>[c.high,c.low]);
            const _smn=Math.min(..._sap),_smx=Math.max(..._sap),_spd=(_smx-_smn)*0.09;
            sCs.applyOptions({autoscaleInfoProvider:()=>({priceRange:{minValue:_smn-_spd,maxValue:_smx+_spd}})});

      }

      // ── Fibonacci: seletores de nível e modo separados ──
      if(ind.id==='fib'){
        // helper: reconstrói ms.params.cond a partir de fibLevel + fibMode
        function syncFibCond(){
          const lvl=ms.params.fibLevel||'61.8%';

          'Toque: o pavio do candle basta tocar o nível para disparar — mais sinais, menos filtro.\n\nValidação: o candle precisa fechar confirmando a rejeição (fecha de volta na direção do impulso após tocar o nível) — menos sinais, mais qualidade.\n\nExemplo: candle que tocou 61.8% com o pavio e fechou de volta para cima = Validação.'));

      if(conds.length>0 && ind.id!=='fvg' && ind.id!=='fib'){

        row.appendChild(slabel(ind.id==='candle'?'Padrão':'Condição'));

        } else {
          // ── Standard radio list ──
          const radios=[];
          conds.forEach(c=>{
            const r=div('radio-row'+(ms.params.cond===c?' on':''));

    const confirmBtn=h('button',{class:'btn btnP'});
    confirmBtn.id='modal-confirm-btn';

    // refreshModalValidation: called on every param change
    // refreshModalValidation: usa referência direta ao confirmBtn (não getElementById)

    window.refreshModalValidation = function() {
      const tempCond={id:ms.ind.id,name:ms.ind.name,params:{...ms.params}};
      const valIssues = ms.forExitCond
        ? validateExitCondition(tempCond, state.cfg.conditions)
        : validateNewCondition(tempCond, state.cfg.conditions);

      if(vfEl){vfEl.innerHTML='';if(valIssues.length>0)vfEl.appendChild(renderIssues(valIssues));}
      // Update confirm button via direct reference
      if(hasBlock){
        confirmBtn.disabled=true;
        confirmBtn.style.cssText='opacity:0.4;cursor:not-allowed;background:var(--bd);color:var(--txm);display:inline-flex;align-items:center;gap:6px;border:none;padding:11px 22px;font-weight:700;border-radius:8px';

        confirmBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg> Confirmar assim mesmo';
        confirmBtn.onclick=()=>{
          const newCond={id:ms.ind.id,name:ms.ind.name,params:{...ms.params}};
          if(ms.forExitCond){state.cfg.exitCondition=newCond;}
          else{state.cfg.conditions.push(newCond);}

        confirmBtn.style.cssText='';
        confirmBtn.className='btn btnP';
        confirmBtn.innerHTML=IC.check+' Confirmar';
        confirmBtn.onclick=()=>{
          const newCond={id:ms.ind.id,name:ms.ind.name,params:{...ms.params}};
          if(ms.forExitCond){state.cfg.exitCondition=newCond;}
          else{state.cfg.conditions.push(newCond);}
          modalWarnOverride=false;closeModal();renderApp();
        };
      }
    };
  }

  modalEl.appendChild(modal);
  document.body.appendChild(modalEl);
  // Chamar APÓS inserção no DOM (para val-feedback e charts LWC)
  _lwcFlush();
  if(window.refreshModalValidation) refreshModalValidation();
}

// ─── STEP RENDERERS ───────────────────────────────────────────
function renderStep1() {
  const cfg=state.cfg;
  const el=div(state.animate?'aFwd':'');el.style.cssText='display:flex;flex-direction:column;gap:24px';

  // Market toggle
  const mktBlock=div('');
  mktBlock.appendChild(slabel('Mercado'));
  const mktRow=div('');mktRow.style.cssText='display:flex;gap:7px;margin-bottom:4px';
  // 'internacional' indisponível nesta versão — mantido no código para reativar quando necessário
  if (cfg.market === 'internacional') { cfg.market = 'local'; cfg.asset = 'WIN$N'; }
  ['local'].forEach(m=>{
    const c=div('chip'+(cfg.market===m?' on':''));
    c.textContent=m==='local'?'🇧🇷 Brasil (B3)':'🌎 Internacional';
    c.addEventListener('click',()=>{cfg.market=m;cfg.asset=m==='local'?'WIN$N':'EURUSD';renderApp();});
    mktRow.appendChild(c);
  });
  mktBlock.appendChild(mktRow);
  el.appendChild(mktBlock);

  // Asset combobox
  const assetBlock=div('');
  assetBlock.appendChild(slabel('Ativo','Busque por ticker ou nome do ativo. Use o campo de busca abaixo.'));
  const combo=div('asset-combo');
  const searchIcon=div('asset-search-icon');
  searchIcon.innerHTML=IC.search;
  const searchInput=h('input',{type:'text',class:'asset-search',placeholder:'Buscar ativo... ex: WIN, PETR4, EURUSD'});
  const dropdown=div('asset-dropdown');
  combo.append(searchIcon,searchInput);
  document.body.appendChild(dropdown);

  function renderDropdown(filter='') {
    dropdown.innerHTML='';
    const q=filter.toLowerCase();
    const mktData=ASSETS_DATA[cfg.market];
    let hasResults=false;
    for (const [cat,items] of Object.entries(mktData)) {
      const filtered=items.filter(a=>a.t.toLowerCase().includes(q)||a.n.toLowerCase().includes(q));
      if(filtered.length===0) continue;
      hasResults=true;
      const catLabel=div('asset-cat');catLabel.textContent=CAT_LABELS[cat]||cat;
      dropdown.appendChild(catLabel);
      filtered.forEach(a=>{
        const item=div('asset-item'+(cfg.asset===a.t?' active':''));
        const tk=div('asset-ticker');tk.textContent=a.t;
        const nm=div('asset-name');nm.textContent=a.n;
        item.append(tk,nm);
        item.addEventListener('click',()=>{
          cfg.asset=a.t;
          // Snap risk fields to new asset's tick
          const {tick} = getAssetTick(a.t);
          cfg.stopPts   = snapToTick(Math.max(tick, cfg.stopPts),   tick);
          cfg.stopOffset= snapToTick(cfg.stopOffset,  tick);
          cfg.tpPts     = snapToTick(Math.max(tick, cfg.tpPts),     tick);
          // Reset management — fields depend on tick size, force user to reconfigure
          cfg.trailing=false;
          cfg.trailAct =snapToTick(100, tick);
          cfg.trailDist=snapToTick(100, tick);
          cfg.trailStep=snapToTick(50,  tick);
          cfg.partial=false;
          cfg.partAt   =snapToTick(200, tick);
          cfg.partPct  =50;
          cfg.partMoveStop=true;
          dropdown.classList.remove('open');
          searchInput.value='';
          renderApp();
        });
        dropdown.appendChild(item);
      });
    }
    if(!hasResults){
      const empty=div('');empty.style.cssText='padding:16px;text-align:center;font-size:12px;color:var(--txm)';
      empty.textContent='Nenhum ativo encontrado';
      dropdown.appendChild(empty);
    }
  }

  function positionDropdown() {
    const rect = searchInput.getBoundingClientRect();
    dropdown.style.top  = (rect.bottom + 4) + 'px';
    dropdown.style.left = rect.left + 'px';
    dropdown.style.width = rect.width + 'px';
  }
  searchInput.addEventListener('focus',()=>{renderDropdown(searchInput.value);positionDropdown();dropdown.classList.add('open');});
  searchInput.addEventListener('input',()=>{renderDropdown(searchInput.value);positionDropdown();dropdown.classList.add('open');});
  document.addEventListener('click',e=>{if(!combo.contains(e.target))dropdown.classList.remove('open');},{once:false});

  assetBlock.appendChild(combo);

  // Selected asset display
  const cur=findAsset(cfg.asset);
  if(cur){
    const sel=div('asset-selected');
    const tk=div('asset-ticker');tk.textContent=cur.t;
    const nm=div('asset-name');nm.textContent=cur.n;
    const catBadge=div('');catBadge.style.cssText='font-size:10px;color:var(--txs);background:var(--bg3);border:0.5px solid var(--bd);border-radius:4px;padding:1px 6px;font-weight:600;font-family:"JetBrains Mono",monospace';
    catBadge.textContent=CAT_LABELS[cur.cat]||cur.cat;
    sel.append(tk,nm,catBadge);
    assetBlock.appendChild(sel);
  }
  el.appendChild(assetBlock);

  // Timeframe
  const tfBlock=div('');
  tfBlock.appendChild(slabel('Timeframe'));
  // 'D' indisponível nesta versão — mantido em TFS para reativar quando necessário
  if (cfg.tf === 'D') cfg.tf = '60m';
  tfBlock.appendChild(chipsWrap(TFS.filter(tf => tf !== 'D'), cfg.tf, v => { cfg.tf = v; renderApp(); }));
  el.appendChild(tfBlock);

  // Window
  const wBlock=div('');
  wBlock.appendChild(slabel('Janela Operacional','Define três momentos: início da leitura de sinais, horário máximo para abrir novas posições, e horário de encerramento forçado de posições abertas.'));

  const lb1=div('');lb1.style.cssText='font-size:13px;color:var(--txs);min-width:120px';lb1.textContent='Início da leitura';
  r1.append(lb1,timeStepper(cfg.tStart,v=>{cfg.tStart=v;renderApp();}));

  const r2=div('');r2.style.cssText='display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap';
  const lb2=div('');lb2.style.cssText='font-size:13px;color:var(--txs);min-width:120px';lb2.textContent='Última abertura';
  const tip2=div('');tip2.style.cssText='font-size:11px;color:var(--txm)';tip2.textContent='Nenhuma operação nova após este horário';
  r2.append(lb2,timeStepper(cfg.tLastEntry,v=>{cfg.tLastEntry=v;renderApp();}),tip2);

  const r3=div('');r3.style.cssText='display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap';
  const lb3=div('');lb3.style.cssText='font-size:13px;color:var(--txs);min-width:120px';lb3.textContent='Encerramento';
  const tip3=div('');tip3.style.cssText='font-size:11px;color:var(--txm)';tip3.textContent='Posições abertas são encerradas neste horário';
  r3.append(lb3,timeStepper(cfg.tEnd,v=>{cfg.tEnd=v;renderApp();}),tip3);

  wBlock.append(r1,r2,r3);
  el.appendChild(wBlock);

  // Max daily trades
  const dtBlock=div('');
  dtBlock.appendChild(slabel('Operações por dia','Limite máximo de operações que podem ser abertas no mesmo dia. Zero = sem limite.'));
  const dtRow=div('');dtRow.style.cssText='display:flex;align-items:center;gap:9px;flex-wrap:wrap';
  const dtHint=div('');dtHint.style.cssText='font-size:11px;color:var(--txm)';
  function updateDtHint(v){dtHint.textContent=v===0?'Sem limite':'Máximo de '+v+(v>1?' operações':' operação')+' por dia';}
  updateDtHint(cfg.maxDailyTrades);
  dtRow.appendChild(stepper(cfg.maxDailyTrades,0,100,'',v=>{cfg.maxDailyTrades=v;renderApp();}));
  dtRow.appendChild(dtHint);
  dtBlock.appendChild(dtRow);
  el.appendChild(dtBlock);

  // Validation: janela operacional
  const s1issues=validateStep1(cfg);
  if(s1issues.length>0) el.appendChild(renderIssues(s1issues));
  return el;
}

function renderStep2() {
  const cfg=state.cfg;
  const el=div(state.animate?'aFwd':'');el.style.cssText='display:flex;flex-direction:column;gap:18px';

  // ── Direção (primeiro) ──
  const inferred=inferDirection(cfg.conditions);
  if(inferred.dir==='long') cfg.direction='long';
  else if(inferred.dir==='short') cfg.direction='short';
  else if(inferred.dir==='both') cfg.direction='both';

  const dirBlock=div('');
  dirBlock.appendChild(slabel('Direção da operação','Define se o sistema deve procurar setups de Compra, Venda, ou ambos simultaneamente.'));
  const dirRow=div('');dirRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const isLong=cfg.direction==='long'||cfg.direction==='both';
  const isShort=cfg.direction==='short'||cfg.direction==='both';
  const locked=inferred.dir!==null;

  // Compra
  const longCard=div('card pick'+(isLong?' selp':''));
  longCard.style.cssText='padding:12px 16px;display:flex;align-items:center;gap:10px;flex:1;min-width:120px'+(locked?';opacity:0.7;pointer-events:none':'');
  longCard.innerHTML='<span style="font-size:18px">▲</span><span style="font-size:13px;font-weight:700;color:'+(isLong?'#10B981':'var(--txs)')+'">Compra</span>';
  if(!locked) longCard.addEventListener('click',()=>{cfg.direction=(isLong&&isShort)?'short':(!isLong?'both':'short');renderApp();});

  // Venda
  const shortCard=div('card pick dir-venda'+(isShort?' seld':''));
  shortCard.style.cssText='padding:12px 16px;display:flex;align-items:center;gap:10px;flex:1;min-width:120px'+(locked?';opacity:0.7;pointer-events:none':'');
  shortCard.innerHTML='<span style="font-size:18px">▼</span><span style="font-size:13px;font-weight:700;color:'+(isShort?'#EF4444':'var(--txs)')+'">Venda</span>';
  if(!locked) shortCard.addEventListener('click',()=>{cfg.direction=(isShort&&isLong)?'long':(!isShort?'both':'long');renderApp();});

  dirRow.append(longCard,shortCard);
  dirBlock.appendChild(dirRow);

  // Hint / lock banner
  if(locked && inferred.dir!=='conflict'){
    const hint=div('');hint.style.cssText='font-size:11px;color:#00D4AA;margin-top:6px;display:flex;align-items:center;gap:5px';
    hint.innerHTML=IC.act+' Direção definida automaticamente pelas condições';
    dirBlock.appendChild(hint);
  } else if(locked && inferred.dir==='conflict'){
    const hint=div('');hint.style.cssText='font-size:11px;color:#EF4444;margin-top:6px;display:flex;align-items:center;gap:5px';
    hint.innerHTML=IC.warn+' Conflito de direção nas condições — revise';
    dirBlock.appendChild(hint);
  } else {
    const hint=div('');hint.style.cssText='font-size:11px;color:var(--txm);margin-top:4px';
    if(cfg.direction==='both'){
      hint.style.color='#6366F1';
      hint.textContent='✓ Compra e Venda — ambas direções ativas';
    } else {
      hint.textContent=(cfg.direction==='long'?'▲ Apenas Compra ativa':'▼ Apenas Venda ativa')+' · Clique no outro botão para adicionar';
    }
    dirBlock.appendChild(hint);
  }
  el.appendChild(dirBlock);

  // Divider
  const div2=document.createElement('div');div2.style.cssText='height:1px;background:var(--bd)';el.appendChild(div2);

  // ── Condições ──
  const condTitle=div('');condTitle.style.cssText='font-size:13px;color:var(--txs);line-height:1.6';
  condTitle.innerHTML='Quando <strong style="color:var(--tx)">TODAS</strong> estas condições forem verdadeiras simultaneamente:';
  el.appendChild(condTitle);

  if(cfg.conditions.length===0){
    const empty=div('');
    empty.style.cssText='border:1px dashed var(--bd);border-radius:11px;padding:32px 18px;text-align:center';
    empty.innerHTML=`${IC.search}<div style="font-size:13px;color:var(--txs);margin-top:9px;margin-bottom:3px">Nenhuma condição adicionada</div><div style="font-size:11px;color:var(--txm)">Adicione pelo menos uma condição para definir seu setup</div>`;
    el.appendChild(empty);
  } else {
    const list=div('');list.style.cssText='display:flex;flex-direction:column;gap:5px';
    cfg.conditions.forEach((c,i)=>{
      if(i>0){
        const andBadge=div('');andBadge.style.cssText='text-align:center;margin-bottom:3px';
        andBadge.innerHTML=`<span style="display:inline-block;padding:2px 15px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;font-size:10px;font-weight:800;color:#00D4AA;letter-spacing:.08em">E</span>`;
        list.appendChild(andBadge);
      }
      const card=div('card');card.style.cssText='padding:12px 14px';

      // Top row: icon + label + remove
      const topRow=div('');topRow.style.cssText='display:flex;align-items:center;gap:11px';
      const ic=div('');ic.style.cssText='width:26px;height:26px;border-radius:6px;background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#00D4AA';
      ic.innerHTML=IC.act;
      const lbl=div('');lbl.style.cssText='flex:1;font-size:13px;font-weight:600;color:var(--tx)';lbl.textContent=condLabel(c);
      const rmBtn=h('button',{class:'btnGh',onclick:()=>{cfg.conditions.splice(i,1);renderApp();}});
      rmBtn.innerHTML=IC.x;
      topRow.append(ic,lbl,rmBtn);
      card.appendChild(topRow);

      // Inline editable params
      const p=c.params;
      const hasEditableParams=(p.per!==undefined)||(p.val!==undefined)||(p.mult!==undefined)||(p.per2!==undefined);
      if(hasEditableParams){
        const paramsRow=div('');paramsRow.style.cssText='display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);align-items:center';
        paramsRow.addEventListener('click',e=>e.stopPropagation());

        if(p.per!==undefined){
          const g=div('');g.style.cssText='display:flex;flex-direction:column;gap:3px';
          const lb=div('');lb.style.cssText='font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em';
          lb.textContent=p.per2!==undefined?'Período curta':'Período';
          g.appendChild(lb);
          const _perMin=(c.id==='bb')?6:1;
          g.appendChild(stepper(p.per,_perMin,500,'',v=>{p.per=v;updateCondition(lbl,c);}));
          paramsRow.appendChild(g);
        }
        if(p.per2!==undefined){
          const g=div('');g.style.cssText='display:flex;flex-direction:column;gap:3px';
          const lb=div('');lb.style.cssText='font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em';lb.textContent='Período longa';
          g.appendChild(lb);
          g.appendChild(stepper(p.per2,1,500,'',v=>{p.per2=v;updateCondition(lbl,c);}));
          paramsRow.appendChild(g);
        }
        if(p.val!==undefined){
          const g=div('');g.style.cssText='display:flex;flex-direction:column;gap:3px';
          const lb=div('');lb.style.cssText='font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em';
          const _isPts=c.id==='gap'||c.id==='range';
          lb.textContent=_isPts?'Tamanho mínimo':'Valor';
          g.appendChild(lb);
          if(_isPts){
            g.appendChild(stepperPoints(p.val,0,5000,cfg.asset,v=>{p.val=v;updateCondition(lbl,c);}));
          } else {
            const _vMin=(c.id==='rsi'||c.id==='stoch'||c.id==='adx')?0:c.id==='williams'?-100:-999;
            const _vMax=(c.id==='rsi'||c.id==='stoch'||c.id==='adx')?100:c.id==='williams'?0:99999;
            g.appendChild(stepper(p.val,_vMin,_vMax,'',v=>{p.val=v;updateCondition(lbl,c);}));
          }
          paramsRow.appendChild(g);
        }
        if(p.dev!==undefined){
          const g=div('');g.style.cssText='display:flex;flex-direction:column;gap:3px';
          const lb=div('');lb.style.cssText='font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em';lb.textContent='Desvio';
          g.appendChild(lb);
          g.appendChild(stepperDecimal(p.dev,0.5,5,0.5,'σ',v=>{p.dev=v;updateCondition(lbl,c);}));
          paramsRow.appendChild(g);
        }
        if(p.mult!==undefined){
          const g=div('');g.style.cssText='display:flex;flex-direction:column;gap:3px';
          const lb=div('');lb.style.cssText='font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em';lb.textContent='Multiplicador';
          g.appendChild(lb);
          g.appendChild(stepperDecimal(p.mult,0.1,10,0.1,'×',v=>{p.mult=v;updateCondition(lbl,c);}));
          paramsRow.appendChild(g);
        }
        card.appendChild(paramsRow);
      }

      list.appendChild(card);
    });
    el.appendChild(list);
  }

  const btnRow=div('');btnRow.style.cssText='display:flex;gap:8px';

  const stratBtn=h('button',{class:'btn btnS',style:{justifyContent:'center',borderRadius:'10px',padding:'11px',flex:'1',background:'var(--acd)',borderColor:'var(--ac)',color:'var(--ac)'},onclick:()=>openStrategiesModal()});
  stratBtn.innerHTML='⚡ Estratégias Famosas';

  const addBtn=h('button',{class:'btn btnS',style:{justifyContent:'center',border:'1px dashed var(--bdh)',borderRadius:'10px',padding:'11px',flex:'1'},onclick:()=>openModal(false)});
  addBtn.innerHTML=IC.plus+' Adicionar condição';

  btnRow.append(stratBtn,addBtn);
  el.appendChild(btnRow);
  return el;
}

      slLevelBlock.appendChild(slLevelRow);fiboBody.appendChild(slLevelBlock);

    // TP Level (só se tpType=fibo)
    if(cfg.tpType==='fibo'){
      const tpTitle=div('');tpTitle.style.cssText='font-size:12px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em;margin-top:4px';tpTitle.textContent='Nível de Take Profit';

      FIBO_ALL_LEVELS.forEach(([val,lbl])=>{

        ch.addEventListener('click',()=>{cfg.fiboTPLevel=val;tpLevelRow.querySelectorAll('.chip').forEach(c2=>c2.classList.remove('on'));ch.classList.add('on');});
        tpLevelRow.appendChild(ch);
      });
      tpLevelBlock.appendChild(tpLevelRow);fiboBody.appendChild(tpLevelBlock);
    }

    fiboBlock.appendChild(fiboBody);
  } else {
    const fiboCollapsed=div('');fiboCollapsed.style.cssText='padding:12px 16px;font-size:12px;color:var(--txm)';
    fiboCollapsed.textContent='Ative o toggle acima para usar o Fibonacci como gatilho, ou selecione Fibonacci nos tipos de SL/TP para configurar os níveis.';
    fiboBlock.appendChild(fiboCollapsed);

  el.appendChild(fiboBlock);

  return el;
}

function renderConfirm() {
  const cfg=state.cfg;
  const asset=findAsset(cfg.asset);
  const entryMap={breakout:'Rompimento da máx/mín do candle de sinal',next_open:'Abertura do próximo candle'};
  const stopDesc={fixed:`${cfg.stopPts} pts abaixo/acima da entrada`,hl_candle:`Máx/Mín do candle de sinal (+${cfg.stopOffset} pts)`,n_candles:`Máx/Mín dos últimos ${cfg.stopCandles} candles${cfg.stopNOffset?` + ${cfg.stopNOffset} pts`:''}`,atr:`${cfg.stopAtrMult.toFixed(1)}× ATR(${cfg.stopAtrPer})`}[cfg.stopType];
  const tpDesc={fixed:`${cfg.tpPts} pts`,rr:`${cfg.tpRR}× o risco${cfg.stopType==='fixed'?' = '+(cfg.tpRR*cfg.stopPts).toLocaleString('pt-BR')+' pts':''}`,atr:`${cfg.tpAtrMult.toFixed(1)}× ATR(${cfg.tpAtrPer})`,fib_ext:`Extensão Fibonacci ${cfg.tpFibLevel}%`,none:'Sem alvo fixo'}[cfg.tpType];
  const mgmt=[];
  if(cfg.trailing) mgmt.push(`Trailing após ${cfg.trailAct} pts (dist.${cfg.trailDist}, step ${cfg.trailStep})`);
  if(cfg.partial && !PARTIAL_REALIZ_DISABLED)  mgmt.push(`Parcial ${cfg.partPct}% aos ${cfg.partAt} pts${cfg.partMoveStop?', move stop':''}` );
  if(cfg.exitCond&&cfg.exitCondition) mgmt.push('Saída: '+condLabel(cfg.exitCondition));

  const el=div(state.animate?'aUp':'');el.style.maxWidth='660px';

  const title=div('');title.style.cssText='font-size:19px;font-weight:700;color:var(--tx);margin-bottom:5px';title.textContent='Confirmar e Rodar';
  const sub=div('');sub.style.cssText='font-size:13px;color:var(--txs);margin-bottom:20px';sub.textContent='Revise as configurações antes de iniciar o backtest.';
  el.append(title,sub);

  const box=div('card');box.style.padding='20px 24px';
  function row(key,val) {
    const r=div('confirm-row');
    const k=div('confirm-key');k.textContent=key;
    const v=div('confirm-val');v.innerHTML=val;
    r.append(k,v);return r;
  }
  const dirText=cfg.direction==='long'?'Apenas compra':cfg.direction==='short'?'Apenas venda':'Compra e venda';
  const condText=cfg.conditions.length===0?'<span style="color:var(--txm)">Sem condições configuradas</span>':cfg.conditions.map((c,i)=>(i>0?`<strong style="color:#00D4AA"> E </strong>`:'')+condLabel(c)).join('');
  box.append(
    row('Mercado',`<span style="color:#00D4AA">${asset?.n||cfg.asset} (${cfg.asset})</span> · ${cfg.tf} · Leitura ${cfg.tStart} · Última abertura ${cfg.tLastEntry} · Encerramento ${cfg.tEnd}${cfg.maxDailyTrades>0?' · Máx '+cfg.maxDailyTrades+' ops/dia':''}`),
    row('Condições de entrada',condText),
    row('Gatilho',`${dirText} · ${entryMap[cfg.entryType]} · Validade: ${cfg.validity} candles`),
    row('Stop Loss',stopDesc),
    row('Take Profit',tpDesc),
  );
  const lastRow=div('confirm-row');lastRow.style.borderBottom='none';lastRow.style.marginBottom='0';lastRow.style.paddingBottom='0';
  const lk=div('confirm-key');lk.textContent='Gestão';
  const lv=div('confirm-val');lv.textContent=mgmt.join(' · ');
  lastRow.append(lk,lv);

  // Período row inside summary box
  const periodRow=div('confirm-row');periodRow.style.cssText='border-bottom:none;margin-bottom:0;padding-bottom:0';
  const prk=div('confirm-key');prk.textContent='Período';
  const prv=div('confirm-val');prv.id='bp-period-summary';
  periodRow.append(prk,prv);box.append(lastRow,periodRow);
  el.appendChild(box);

  // ── Initialize defaults ──
  const today=new Date();today.setHours(0,0,0,0);
  if(!state.cfg.backtestDateFrom)state.cfg.backtestDateFrom=new Date(defaultDateFrom());
  if(!state.cfg.backtestDateTo)state.cfg.backtestDateTo=new Date(today);

  // ── Helpers ──
  const currencySymbols={'R$':'R$','USD':'$','EUR':'€','GBP':'£','JPY':'¥','AUD':'A$','HKD':'HK$'};
  const currency=findAsset(cfg.asset)?.currency||'R$';
  const symbol=currencySymbols[currency]||currency;
  const mShort=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function dateToStr(d){if(!d)return'';const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');return dd+'/'+mm+'/'+d.getFullYear();}
  function strToDate(s){if(!s||s.length!==10)return null;const p=s.split('/');const d=new Date(+p[2],+p[1]-1,+p[0]);return isNaN(d.getTime())?null:d;}

  let infoEl=null;
  function updatePeriodDisplay(){
    const df=state.cfg.backtestDateFrom||defaultDateFrom();
    const dt=state.cfg.backtestDateTo||new Date();
    const totalDays=Math.round((dt-df)/86400000);
    const years=(totalDays/365.25).toFixed(1);
    const workingDays=Math.round(totalDays*(5/7));
    const candles=calcCandlesForPeriod(cfg.tf,workingDays).toLocaleString('pt-BR');
    if(infoEl)infoEl.textContent=years+' anos · '+workingDays.toLocaleString('pt-BR')+' dias úteis · ~'+candles+' candles ('+cfg.tf+')';
    const ps=document.getElementById('bp-period-summary');
    if(ps)ps.textContent=dateToStr(df)+' → '+dateToStr(dt)+' ('+mShort[df.getMonth()]+' '+df.getFullYear()+' – '+mShort[dt.getMonth()]+' '+dt.getFullYear()+')';
  }

  // ── Date picker ──
  function createDatePicker(inputEl,getMin,getMax,onSelect){
    let pickerEl=null,curYear,curMonth;
    function renderPicker(){
      if(!pickerEl)return;pickerEl.innerHTML='';
      const minD=getMin();const maxD=getMax();const selected=strToDate(inputEl.value);
      const hdr=div('');hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:10px';
      const prevBtn=div('');prevBtn.innerHTML=IC.back;prevBtn.style.cssText='cursor:pointer;color:var(--txs);padding:4px 8px;border-radius:6px';
      prevBtn.onmouseenter=()=>prevBtn.style.background='var(--bg3)';prevBtn.onmouseleave=()=>prevBtn.style.background='';
      prevBtn.onclick=(e)=>{e.stopPropagation();curMonth--;if(curMonth<0){curMonth=11;curYear--;}renderPicker();};
      const nextBtn=div('');nextBtn.innerHTML=IC.fwd;nextBtn.style.cssText='cursor:pointer;color:var(--txs);padding:4px 8px;border-radius:6px';
