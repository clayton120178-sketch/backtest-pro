// ─── BACKEND INTEGRATION ─────────────────────────────────────

// Converte resultado do worker (metrics + trades + equity_curve) para formato EQ do frontend
function convertBackendResult(result, deposit) {
  deposit = deposit || 100000;
  const metrics = result.metrics || {};
  const trades = result.trades || [];
  const equityCurve = result.equity_curve || [];

  // Se temos trades, construir EQ a partir deles
  if (trades.length > 0) {
    let v = 0, peak = 0;
    return trades.map((t, i) => {
      const pnl = (t.profit || 0) + (t.commission || 0) + (t.swap || 0);
      v += pnl;
      if (v > peak) peak = v;
      // Extrair data do trade para label
      const dt = t.close_time || t.open_time || '';
      const parts = dt.split(/[.\s-]/);
      let tLabel = '';
      if (parts.length >= 2) {
        const yr = parts[0], mo = parseInt(parts[1]) - 1;
        const d = new Date(parseInt(yr), mo);
        tLabel = d.toLocaleDateString('pt-BR', {month:'short'}).replace('.','') + " '" + String(yr).slice(2);
      } else {
        tLabel = 'T' + (i+1);
      }
      return { v: Math.round(v), dd: Math.round(Math.min(0, v - peak)), pnl: Math.round(pnl), t: tLabel };
    });
  }

  // Fallback: se temos equity_curve (array de saldos), converter para PnL relativo
  if (equityCurve.length > 0) {
    let peak = 0;
    return equityCurve.map((balance, i) => {
      const v = balance - deposit;
      if (v > peak) peak = v;
      const pnl = i === 0 ? v : (balance - equityCurve[i-1]);
      return { v: Math.round(v), dd: Math.round(Math.min(0, v - peak)), pnl: Math.round(pnl), t: 'T' + (i+1) };
    });
  }

  // Ultimo fallback: gerar EQ sintetico a partir das metricas
  const totalTrades = metrics.total_trades || 0;
  const winRate = (metrics.win_rate || 50) / 100;
  const avgWin = metrics.gross_profit && metrics.win_trades ? metrics.gross_profit / metrics.win_trades : 200;
  const avgLoss = metrics.gross_loss && metrics.loss_trades ? Math.abs(metrics.gross_loss) / metrics.loss_trades : 150;

  let v = 0, peak = 0;
  const eq = [];
  // Seed baseado no checksum para ser determinístico
  let s = totalTrades * 7919 + Math.round((metrics.total_net_profit || 0) * 100);
  const rng = () => { s = (s * 16807 + 0) % 2147483647; return (s & 0x7fffffff) / 2147483647; };

  for (let i = 0; i < Math.max(totalTrades, 30); i++) {
    const isWin = rng() < winRate;
    const pnl = isWin ? avgWin * (0.5 + rng()) : -avgLoss * (0.5 + rng());
    v += pnl;
    if (v > peak) peak = v;
    eq.push({ v: Math.round(v), dd: Math.round(Math.min(0, v - peak)), pnl: Math.round(pnl), t: 'T' + (i+1) });
  }
  return eq;
}

// Envia backtest para o backend e faz polling do resultado
async function submitBacktestToBackend() {
  if (!currentUser) {
    alert('Faca login para rodar backtests.');
    return null;
  }

  // Obter sessão corrente (Supabase JS v2 gerencia refresh automaticamente)
  const { data: sessionData } = await db.auth.getSession();
  const token = sessionData?.session?.access_token;
  if (!token) {
    alert('Sessao expirada. Faca login novamente.');
    await db.auth.signOut();
    return null;
  }

  // Submeter para a fila
  try {
    const res = await fetch(`${SUPA_URL}/functions/v1/submit-backtest`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
        'apikey': SUPA_KEY,
      },
      body: JSON.stringify({ cfg: {
        ...state.cfg,
        stopOffset: state.cfg.stopType==='n_candles'
          ? (state.cfg.stopNOffset||0)
          : state.cfg.stopOffset,
        backtest_period: {
          date_from: toISO(state.cfg.backtestDateFrom || defaultDateFrom()),
          date_to:   toISO(state.cfg.backtestDateTo   || new Date()),
        },
        initial_capital:  state.cfg.initialCapital || 10000,
        capital_currency: findAsset(state.cfg.asset)?.currency || 'R$',
      } }),
    });

    const data = await res.json();
    console.log('submit-backtest response:', res.status, data);

    if (!res.ok) {
      return { error: data.error || `Erro ${res.status}: ${JSON.stringify(data)}` };
    }

    return { backtest_id: data.backtest_id };
  } catch (e) {
    return { error: 'Erro de conexao: ' + e.message };
  }
}

// Polling do status do backtest
async function pollBacktestResult(backtestId, onProgress, onDone, onError) {
  const maxAttempts = 720; // 720 * 5s = 60 min max
  let attempts = 0;
  const progressMsgs = getLoadMsgs();

  // Obter token do usuario para RLS
  const session = await db.auth.getSession();
  const userToken = session?.data?.session?.access_token;
  if (!userToken) { onError('Sessão expirada. Faça login novamente.'); return; }

  const poll = async () => {
    if (attempts >= maxAttempts) {
      onError('Timeout: backtest demorou mais de 60 minutos.');
      return;
    }

    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/backtests?id=eq.${backtestId}&select=status,result,error`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${userToken}` } }
      );
      const rows = await res.json();
      if (!rows || rows.length === 0) {
        onError('Backtest nao encontrado.');
        return;
      }

      const bt = rows[0];

      if (bt.status === 'completed' && bt.result) {
        onDone(bt.result);
        return;
      }

      if (bt.status === 'failed') {
        onError(bt.error || 'Backtest falhou sem mensagem de erro.');
        return;
      }

      // Ainda processando
      attempts++;
      const msgIdx = Math.min(Math.floor(attempts / 3), progressMsgs.length - 1);
      onProgress(progressMsgs[msgIdx], attempts);
      setTimeout(poll, 5000);
    } catch (e) {
      attempts++;
      if (attempts < maxAttempts) {
        setTimeout(poll, 5000);
      } else {
        onError('Erro de conexao durante polling: ' + e.message);
      }
    }
  };

  poll();
}

// ─── LOADING ─────────────────────────────────────────────────
function defaultDateFrom() {
  const d = new Date();
  d.setFullYear(d.getFullYear() - 5);
  d.setHours(0,0,0,0);
  return d;
}

function getBacktestPeriod() {
  const start = state.cfg.backtestDateFrom ? new Date(state.cfg.backtestDateFrom) : defaultDateFrom();
  const now   = state.cfg.backtestDateTo   ? new Date(state.cfg.backtestDateTo)   : new Date();
  start.setHours(0,0,0,0); now.setHours(0,0,0,0);
  const mLong  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mShort = ['Jan','Fev','Mar','Abr','Mai','Jun',
                  'Jul','Ago','Set','Out','Nov','Dez'];
  const startLong  = `${mLong[start.getMonth()]} ${start.getFullYear()}`;
  const endLong    = `${mLong[now.getMonth()]} ${now.getFullYear()}`;
  const startShort = `${mShort[start.getMonth()]} ${start.getFullYear()}`;
  const endShort   = `${mShort[now.getMonth()]} ${now.getFullYear()}`;
  const totalMonths = (now.getFullYear() - start.getFullYear()) * 12
                    + (now.getMonth() - start.getMonth());
  return { startLong, endLong, startShort, endShort, totalMonths, start, end: now };
}

function calcCandles(tf) {
  const diasUteis = 5 * 252;
  return calcCandlesForPeriod(tf, diasUteis).toLocaleString('pt-BR');
}

function calcCandlesForPeriod(tf, workingDays) {
  const tfMin = {'1m':1,'2m':2,'5m':5,'10m':10,'15m':15,'30m':30,'60m':60,'D':480};
  const minTf = tfMin[tf] || 5;
  return Math.round((510 / minTf) * workingDays); // 510 min = 09:00-17:30
}

function toISO(d) { return d.toISOString().slice(0,10); }

function getLoadMsgs() {
  const tf = state.cfg ? state.cfg.tf : '5m';
  const tfLabel = {'1m':'1 minuto','2m':'2 minutos','5m':'5 minutos','10m':'10 minutos',
                   '15m':'15 minutos','30m':'30 minutos','60m':'60 minutos','D':'diário'}[tf] || tf;
  const dateFrom   = state.cfg.backtestDateFrom || defaultDateFrom();
  const dateTo     = state.cfg.backtestDateTo   || new Date();
  const totalDays  = Math.round((dateTo - dateFrom) / 86400000);
  const years      = Math.round(totalDays / 365);
  const workingDays = Math.round(totalDays * 5/7);
  const candles    = calcCandlesForPeriod(tf, workingDays).toLocaleString('pt-BR');
  return [
    'Enviando para processamento...',
    `Analisando ${years} ${years===1?'ano':'anos'} de dados reais do mercado...`,
    `Carregando ~${candles} candles de ${tfLabel}...`,
    'Simulando cada operacao, candle por candle...',
    'Calculando o que teria acontecido com o seu dinheiro...',
    'Medindo drawdowns - os momentos dificeis tambem contam...',
    'Quase la. A verdade sobre esse setup esta chegando...',
  ];
}

async function startLoading() {
  state.animate=true;state.screen='loading';state.loadMsg=0;renderApp();

  // 1. Submeter backtest
  const submission = await submitBacktestToBackend();

  if (!submission || submission.error) {
    // Erro ao submeter: mostrar na tela de loading e voltar
    const errMsg = submission ? submission.error : 'Erro desconhecido';
    console.error('submitBacktest error:', errMsg);
    const msgEl = document.getElementById('load-msg');
    if (msgEl) msgEl.textContent = errMsg;
    setTimeout(() => { state.animate=true; state.screen='confirm'; renderApp(); }, 5000);
    return;
  }

  // 2. Polling do resultado
  pollBacktestResult(
    submission.backtest_id,
    // onProgress
    (msg, attempt) => {
      const msgEl = document.getElementById('load-msg');
      if (msgEl) msgEl.textContent = msg;
      // Atualizar barra de progresso (estimativa)
      const fill = document.querySelector('.load-fill');
      if (fill) {
        const pct = Math.min(90, attempt * 2);
        fill.style.width = pct + '%';
      }
    },
    // onDone
    (result) => {
      // Armazenar métricas do backend — fonte da verdade para o relatório
      CURRENT_BACKEND_METRICS = (result && result.metrics) ? result.metrics : null;
      // Depósito real usado pelo MT5 (backend informa via initial_deposit)
      const deposit = (CURRENT_BACKEND_METRICS && CURRENT_BACKEND_METRICS.initial_deposit)
                      ? CURRENT_BACKEND_METRICS.initial_deposit : 10000;
      // Converter para formato EQ — usado apenas pelos gráficos (curva de equity)
      EQ = convertBackendResult(result, deposit);
      if (EQ.length === 0) {
        // Fallback: resultado sem trades
        EQ = [{ v: 0, dd: 0, pnl: 0, t: 'N/A' }];
      }
      EQ_ANALYSIS = computeAnalysis(EQ, deposit);

      CURRENT_BACKTEST_ID = submission.backtest_id || null;
      // Completar barra e mostrar resultados
      const fill = document.querySelector('.load-fill');
      if (fill) fill.style.width = '100%';
      setTimeout(() => { state.animate=true; state.screen='results'; renderApp(); }, 500);
    },
    // onError
    (errorMsg) => {
      const msgEl = document.getElementById('load-msg');
      if (msgEl) {
        msgEl.style.color = '#EF4444';
        msgEl.textContent = errorMsg;
      }
      // Botao para voltar
      const loadScreen = document.querySelector('.loading-screen');
      if (loadScreen) {
        const backBtn = document.createElement('button');
        backBtn.className = 'btn btnS';
        backBtn.style.cssText = 'margin-top:20px';
        backBtn.textContent = 'Voltar';
        backBtn.onclick = () => { state.animate=true; state.screen='confirm'; renderApp(); };
        loadScreen.appendChild(backBtn);
      }
    }
  );
}

// ─── RESULTS ─────────────────────────────────────────────────
function getMetrics(){
  const A=EQ_ANALYSIS;
  const BM=CURRENT_BACKEND_METRICS;
  // Métricas do backend têm prioridade (calculadas pelo MT5/parser).
  // Fallback para EQ_ANALYSIS em demos e histórico mock.
  const totalTrades = BM ? (BM.total_trades        ?? 0)        : EQ.length;
  const winRate     = BM ? (BM.win_rate             ?? 0)        : A.winRate;
  const netProfit   = BM ? (BM.total_net_profit     ?? 0)        : EQ[EQ.length-1].v;
  const ddPct       = BM ? (BM.max_drawdown_pct     ?? 0)        : A.maxDDPct;
  const pf          = BM ? (BM.profit_factor        ?? 0)        : A.profitFactor;
  // Payoff: lê do backend; se vier zero (campo ausente no parser HTML), recalcula a partir dos brutos
  let payoff = BM ? (BM.payoff ?? 0) : A.payoff;
  if (BM && !payoff && (BM.win_trades > 0) && (BM.loss_trades > 0)) {
    const _avgWin = (BM.gross_profit || 0) / BM.win_trades;
    const _avgLos = Math.abs(BM.gross_loss || 0) / BM.loss_trades;
    if (_avgLos > 0) payoff = _avgWin / _avgLos;
  }
  const rf          = BM ? (BM.recovery_factor      ?? 0)        : A.recoveryFactor;
  const deposit     = BM ? (BM.initial_deposit      || 10000)    : A.cap;
  const rentab      = deposit>0 ? (netProfit/deposit)*100 : 0;
  const ok          = netProfit>=0;
  return[
    {label:'Total de Trades',val:totalTrades.toLocaleString('pt-BR'),color:'var(--tx)'},
    {label:'Taxa de Acerto',val:winRate.toFixed(1)+'%',color:'#F59E0B',pct:winRate},
    {label:'Lucro Total',val:(ok?'+':'')+'R$ '+Math.abs(netProfit).toLocaleString('pt-BR',{maximumFractionDigits:2}),color:ok?'#10B981':'#EF4444'},
    {label:'Max Drawdown',val:'−'+ddPct.toFixed(2)+'%',color:'#EF4444'},
    {label:'Profit Factor',val:pf.toFixed(2),color:pf>1?'#00D4AA':'#EF4444'},
    {label:'Payoff',val:payoff.toFixed(2),color:payoff>1?'#10B981':'#F59E0B'},
    {label:'Recovery Factor',val:rf.toFixed(2),color:rf>2?'#10B981':'#F59E0B'},
    {label:'Rentabilidade',val:rentab.toFixed(2)+'%',color:ok?'#10B981':'#EF4444'},
  ];
}

function viewHistoryItem(id){
  CURRENT_BACKEND_METRICS=null; // histórico mock usa EQ_ANALYSIS como fallback

  if(!bt)return;
  viewingHistoryItem=bt;
  // Generate unique equity curve for this backtest
  const bias=bt.result>0?0.04:-0.02;
  EQ=generateEQ(bt.id*7919,bt.trades>200?90:bt.trades,bias);

}

}

// ─── STRATEGY SENTENCE ────────────────────────────────────────
function buildStrategySentence(cfg, step) {
  if(step === undefined) step = state.step;
  const asset = findAsset(cfg.asset);
  const assetName = asset ? asset.n : cfg.asset;
  const dirText = cfg.direction==='long'
    ? '<span class="hl">comprar</span>'
    : cfg.direction==='short'
    ? '<span class="hl">vender</span>'
    : '<span class="hl">comprar e vender</span>';
  const entryMap = {
    breakout: 'entrando no rompimento da máx/mín do candle de sinal',
    next_open: 'entrando na abertura do próximo candle',
  };
  const stopMap = {
    fixed: `stop fixo de <strong>${cfg.stopPts} pts</strong>`,
    hl_candle: `stop na máx/mín do candle de sinal`,
    n_candles: `stop na máx/mín dos últimos <strong>${cfg.stopCandles} candles</strong>${cfg.stopNOffset?` + <strong>${cfg.stopNOffset} pts</strong>`:''}`,
    atr: `stop de <strong>${cfg.stopAtrMult}× ATR(${cfg.stopAtrPer})</strong>`,
    fibo: `stop no nível Fibonacci configurado`,
  };
  const tpMap = {
    fixed: `alvo de <strong>${cfg.tpPts} pts</strong>`,
    rr: `alvo de <strong>${cfg.tpRR}× o risco</strong>`,
    atr: `alvo de <strong>${cfg.tpAtrMult}× ATR(${cfg.tpAtrPer})</strong>`,
    fib_ext: `alvo na extensão de Fibonacci <strong>${cfg.tpFibLevel}%</strong>`,
    fibo: `alvo no nível Fibonacci configurado`,
    none: 'sem alvo fixo',
  };

  const parts = [];

  // ── Step 0: Mercado ──────────────────────────────────
  // Sempre presente
  const timeStr = `das <strong>${cfg.tStart||'09:00'}</strong> às <strong>${cfg.tEnd||'17:30'}</strong>`;
  parts.push(`Sistema vai ${dirText} <strong>${assetName}</strong> no <strong>${cfg.tf}</strong> · ${timeStr}`);

  // ── Step 1: Condições ────────────────────────────────
  if(step >= 1) {
    const conds = cfg.conditions.length === 0
      ? '<span style="color:var(--txm);font-style:italic">aguardando condições...</span>'
      : cfg.conditions.map(c => `<strong>${condLabel(c)}</strong>`).join(' <span class="hl">e</span> ');
    parts.push(`quando ${conds}`);
  }

  // ── Step 2: Gatilho ──────────────────────────────────
  if(step >= 2 && cfg.conditions.length > 0) {
    const entryTxt = entryMap[cfg.entryType];
    if(entryTxt) parts.push(entryTxt);
    if(cfg.validity > 1) parts.push(`sinal válido por <strong>${cfg.validity} candles</strong>`);
  }

  // ── Step 3: Risco ────────────────────────────────────
  if(step >= 3) {
    const risk = [stopMap[cfg.stopType], tpMap[cfg.tpType]].filter(Boolean);
    if(risk.length) parts.push(risk.join(', '));
  }

  // ── Step 4: Gestão ───────────────────────────────────
  if(step >= 4) {
    if(cfg.trailing) parts.push(`trailing após <strong>${cfg.trailAct} pts</strong>`);
    if(cfg.partial && !PARTIAL_REALIZ_DISABLED) parts.push(`parcial de <strong>${cfg.partPct}%</strong> aos <strong>${cfg.partAt} pts</strong>`);
  }

  return parts.filter(Boolean).join(' · ');
}

function renderProgressBar() {

  pb.innerHTML='';
  if(state.screen!=='wizard') {
    const lbl=div('');lbl.style.cssText='font-size:13px;color:var(--txs);font-weight:500';

  STEPS.forEach((s,i)=>{

    const btn_=h('button',{class:'prog-step',disabled:i>state.maxDone});
    btn_.addEventListener('click',()=>{if(i<=state.maxDone&&i!==state.step){if(i>1&&state.cfg.conditions.length===0)return;state.dir=i>state.step?'fwd':'bwd';state.animate=true;state.step=i;renderApp();}});

    if(circle.querySelector('svg')){const sv=circle.querySelector('svg');sv.style.color=active?'var(--action-t)':done?'white':'var(--txm)';}

    const label=div('prog-label'+(done?' done':active?' active':''));label.textContent=s.label;

    pb.appendChild(btn_);

  });

// ─── ARMAZENAGEM DE BACKTESTS ────────────────────────────────
async function contarBacktestsSalvos(userId) {
  const session = await db.auth.getSession();
  const token = session?.data?.session?.access_token;
  if (!token) return 0;
  const res = await fetch(
    SUPA_URL + '/rest/v1/backtests?select=id&user_id=eq.' + userId + '&status=eq.completed',
    { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token, 'Prefer': 'count=exact', 'Range': '0-0' } }
  );
  const range = res.headers.get('Content-Range');
  if (!range) return 0;
  const total = parseInt(range.split('/')[1], 10);
  return isNaN(total) ? 0 : total;
}

async function buscarBacktestMaisAntigo(userId) {
  const session = await db.auth.getSession();
  const token = session?.data?.session?.access_token;
  if (!token) return null;
  const res = await fetch(
    SUPA_URL + '/rest/v1/backtests?select=id,created_at,config&user_id=eq.' + userId + '&status=eq.completed&order=created_at.asc&limit=1',
    { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token } }
  );
  const data = await res.json();
  return (Array.isArray(data) && data.length > 0) ? data[0] : null;
}

async function salvarBacktest(backtestId) {
  if (!backtestId) return;
  const session = await db.auth.getSession();
  const token = session?.data?.session?.access_token;
  if (!token) return;
  await fetch(
    SUPA_URL + '/rest/v1/backtests?id=eq.' + backtestId,
    {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ saved: true })
    }
  );
}

async function removerSalvo(backtestId) {
  if (!backtestId) return;
  const session = await db.auth.getSession();
  const token = session?.data?.session?.access_token;
  if (!token) return;
  await fetch(
    SUPA_URL + '/rest/v1/backtests?id=eq.' + backtestId,
    {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ saved: false })
    }
  );
}

function showStorageToast(msg) {
  const toast = document.getElementById('storage-toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function fecharModalArmazenagem() {
  const overlay = document.getElementById('storage-modal-overlay');
  if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; }
}

function exibirModalLimiteSalvos(limite, maisAntigo, onSalvar, onSairSemSalvar) {
  const overlay = document.getElementById('storage-modal-overlay');
  if (!overlay) return;

  const planoNome = currentSub ? (PLANOS[currentSub.plan] ? PLANOS[currentSub.plan].nome : currentSub.plan) : 'atual';

  let olderDesc = 'Backtest mais antigo';
  if (maisAntigo) {
    const d = new Date(maisAntigo.created_at);
    const dateStr = d.toLocaleDateString('pt-BR');
    const timeStr = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const cfg = maisAntigo.config || {};
    const asset = cfg.asset || '?';
    const tf = cfg.tf || '?';
    const cond = (cfg.conditions && cfg.conditions[0]) ? cfg.conditions[0].indicator || '?' : '?';
    olderDesc = asset + ' \u00b7 ' + tf + ' \u00b7 ' + cond + ' \u00b7 ' + dateStr + ' \u00e0s ' + timeStr;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = '<div class="storage-modal">' +
    '<div class="storage-modal-title">Limite de ' + limite + ' estrat\u00e9gias salvas atingido</div>' +
    '<div class="storage-modal-body">' +
      'Voc\u00ea atingiu o limite de <strong>' + limite + ' estrat\u00e9gias salvas</strong> do seu plano <strong>' + planoNome + '</strong>.' +
      '<br><br>Este backtest n\u00e3o foi adicionado ao seu hist\u00f3rico de consultas.' +
      '<br><br>Para salvar este resultado, o backtest mais antigo do seu hist\u00f3rico ser\u00e1 removido:' +
      '<div class="storage-modal-oldest">' + olderDesc + '</div>' +
      'Deseja salvar este resultado e remover o backtest acima?' +
    '</div>' +
    '<div class="storage-modal-btns">' +
      '<button id="storage-btn-save">Salvar e remover o mais antigo</button>' +
      '<button id="storage-btn-skip">Sair sem salvar</button>' +
    '</div>' +
  '</div>';

  document.getElementById('storage-btn-save').addEventListener('click', async () => {
    fecharModalArmazenagem();
    if (maisAntigo) await removerSalvo(maisAntigo.id);
    await salvarBacktest(CURRENT_BACKTEST_ID);
    const d = maisAntigo ? new Date(maisAntigo.created_at).toLocaleDateString('pt-BR') : '';
    showStorageToast('Backtest salvo. O registro de ' + d + ' foi removido do hist\u00f3rico.');
    if (onSalvar) onSalvar();
  });

  document.getElementById('storage-btn-skip').addEventListener('click', () => {
    fecharModalArmazenagem();
    if (onSairSemSalvar) onSairSemSalvar();
  });
}

function exibirModalFimTrial(onContinuar) {
  const overlay = document.getElementById('storage-modal-overlay');
  if (!overlay) return;

  overlay.style.display = 'flex';
  overlay.innerHTML = '<div class="storage-modal">' +
    '<div class="storage-modal-title">Voc\u00ea utilizou todos os 5 backtests gratuitos.</div>' +

      '<br><br>Para continuar testando suas estrat\u00e9gias, escolha um plano.' +
    '</div>' +

    '<span class="storage-modal-close-link" id="storage-btn-close">Fechar</span>' +
  '</div>';

  document.getElementById('storage-btn-plans').addEventListener('click', () => {
    fecharModalArmazenagem();

async function verificarArmazenagemAoSair(onProsseguir) {
  // Sem backtest atual para salvar
  if (!CURRENT_BACKTEST_ID || !currentUser) {
    if (onProsseguir) onProsseguir();
    return;
  }

  // Limpar listeners da tela de resultados
  const resultsEl = document.querySelector('.results-screen');
  if (resultsEl && resultsEl._cleanupResultListeners) resultsEl._cleanupResultListeners();

  const plan = currentSub ? currentSub.plan : 'trial';

  // Trial: verificar se é o 5º
  if (plan === 'trial' || !currentSub) {
    // Contar quantos backtests o usuário tem salvos
    const salvos = await contarBacktestsSalvos(currentUser.id);
    if (salvos >= FREE_TRIAL.backtests_max) {
      exibirModalFimTrial(onProsseguir);
      return;
    }
    // Ainda dentro do trial: salvar automaticamente
    await salvarBacktest(CURRENT_BACKTEST_ID);
    if (onProsseguir) onProsseguir();
    return;
  }

  // Usuário pago: verificar limite de salvos
  if (!PLANOS[plan]) {
    if (onProsseguir) onProsseguir();
    return;
  }

  const limite = PLANOS[plan].salvos_max;
  const salvosAtuais = await contarBacktestsSalvos(currentUser.id);

  if (salvosAtuais < limite) {
    await salvarBacktest(CURRENT_BACKTEST_ID);
    if (onProsseguir) onProsseguir();
  } else {
    const maisAntigo = await buscarBacktestMaisAntigo(currentUser.id);
    exibirModalLimiteSalvos(limite, maisAntigo,
      () => { if (onProsseguir) onProsseguir(); },
      () => { if (onProsseguir) onProsseguir(); }
    );
  }
}

function switchPayMethod(method, btnEl) {
  document.querySelectorAll('.pay-method-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  const pixArea = document.getElementById('pix-form-area');
  const cardContainer = document.getElementById('cardPaymentBrick_container');
  if (method === 'pix') {
    payMethod = 'pix';
    if (pixArea) pixArea.style.display = 'block';
    if (cardContainer) cardContainer.style.display = 'none';
  } else {
    const needsRemount = payMethod !== method || !mpMounted;
    payMethod = method;
    if (pixArea) pixArea.style.display = 'none';
    if (cardContainer) cardContainer.style.display = 'block';
    if (needsRemount) {
      // Destroy and recreate Brick with correct card type
      if (window.cardPaymentBrickController) { try { window.cardPaymentBrickController.unmount(); } catch(e){} window.cardPaymentBrickController = null; }
      mpMounted = false;
      if (cardContainer) cardContainer.innerHTML = '';
      initCardBrick();
    }
  }
}

function initCardBrick() {
  const container = document.getElementById('cardPaymentBrick_container');
  if (container) {
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:32px 0;color:var(--txs);font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      Carregando formulário de pagamento...
    </div>`;
  }
  if (!window.MercadoPago) {
    const s = document.createElement('script');
    s.src = 'https://sdk.mercadopago.com/js/v2';
    s.onload = () => renderCardBrick();
    s.onerror = () => {
      if (container) container.innerHTML = '';
      showPayError('Falha ao carregar o formulário de pagamento. Verifique sua conexão e tente novamente.');
      mpMounted = false;
    };
    document.head.appendChild(s);
  } else {
    renderCardBrick();
  }
}

async function renderCardBrick() {
  const container = document.getElementById('cardPaymentBrick_container');
  if (!container) return;
  if (mpMounted) return;
  mpMounted = true;
  const price = PLANOS[selectedPlan].precos[selectedCycle].total;

  const brickTimeout = setTimeout(() => {
    if (!document.getElementById('cardPaymentBrick_container')) return;
    mpMounted = false;
    const c = document.getElementById('cardPaymentBrick_container');
    if (c) c.innerHTML = '';
    showPayError('O formulário demorou para carregar. Isso pode ser um bloqueio de rede ou extensão de navegador. Tente recarregar a página.');
  }, 15000);

  try {
    container.innerHTML = '';
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    mpInstance = new MercadoPago(MP_PUBLIC_KEY, { locale: 'pt-BR' });
    const bricksBuilder = mpInstance.bricks();
    window.cardPaymentBrickController = await bricksBuilder.create('cardPayment', 'cardPaymentBrick_container', {
      initialization: {
        amount: price,
        payer: { email: currentUser?.email || '' },
      },
      customization: {
        visual: {
          style: {
            theme: isLight ? 'default' : 'dark',
            customVariables: isLight ? {
              formBackgroundColor: '#FDFCF9',
              baseColor: '#B86800',
            } : {
              formBackgroundColor: '#12121A',
              baseColor: '#F0A020',
            }
          },
          hideFormTitle: true,
          hidePaymentButton: false,
        },
        paymentMethods: {
          maxInstallments: payMethod === 'credit_card' ? 12 : 1,
          ...(payMethod === 'credit_card' ? { debitCard: 'none' } : { creditCard: 'none' }),
        },
      },
      callbacks: {
        onReady: () => { clearTimeout(brickTimeout); },
        onSubmit: async (formData) => {
          try {
            const { data: { session } } = await db.auth.getSession();
            const res = await fetch(`${SUPA_URL}/functions/v1/create-payment`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
              body: JSON.stringify({
                plan: selectedPlan,
                cycle: selectedCycle,
                payment_type: payMethod,
                payment_method_id: formData.payment_method_id,
                token: formData.token,
                issuer_id: formData.issuer_id || null,
                installments: formData.installments || 1,
                payer: {
                  email: currentUser?.email || '',
                  identification: formData.payer?.identification || { type: 'CPF', number: '' },
                },
              }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { showPayError(data.error || 'Erro no pagamento.'); return; }
            if (data.status === 'approved') {
              await verificarAcesso();
              updateAvatarUI();
              showPaySuccess();
            } else {
              showPayError('Pagamento recusado. Verifique os dados ou tente outro método.');
            }
          } catch(e) { showPayError('Erro ao processar pagamento. Tente novamente.'); }
        },
        onError: (err) => {
          clearTimeout(brickTimeout);
          console.error('[MP Brick] onError:', err);
          mpMounted = false;
          const c = document.getElementById('cardPaymentBrick_container');
          if (c) c.innerHTML = '';
          showPayError('Erro ao inicializar o formulário de pagamento. Tente recarregar a página.');
        },
      },
    });
    clearTimeout(brickTimeout);
  } catch(e) {
    clearTimeout(brickTimeout);
    console.error('[MP Brick] init error:', e);
    mpMounted = false;
    const c = document.getElementById('cardPaymentBrick_container');
    if (c) c.innerHTML = '';
    showPayError('Erro ao carregar o formulário. Tente recarregar a página.');
  }
}

function startPixTimer() {
  let secs = 30 * 60;
  const el = document.getElementById('pix-timer');
  if (!el) return;
  const iv = setInterval(() => {
    secs--;
    if (!document.getElementById('pix-timer')) { clearInterval(iv); return; }
    if (secs <= 0) { clearInterval(iv); el.textContent = 'expirado'; el.style.color = 'var(--dg)'; return; }
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    el.textContent = `${m}:${s}`;
    if (secs < 300) el.style.color = 'var(--dg)';
  }, 1000);
}

async function loadHistoryData() {
  try {
    const { data: sessionData } = await db.auth.getSession();
    const token = sessionData?.session?.access_token;
    if (!token) return;

    const res = await fetch(
      SUPA_URL + '/rest/v1/backtests?select=id,created_at,config,result&user_id=eq.' + currentUser.id +
      '&status=eq.completed&order=created_at.desc&limit=60',
      { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token } }
    );
    if (!res.ok) return;
    const backtests = await res.json();

    const countEl    = document.getElementById('history-count');
    const container  = document.getElementById('history-list-container');
    if (!container) return; // usuário navegou para outra tela

    if (!Array.isArray(backtests) || backtests.length === 0) {
      if (countEl) countEl.textContent = '0 testes realizados';
      container.innerHTML = `
        <div class="history-empty">
          <div style="width:56px;height:56px;border-radius:14px;background:var(--acd2);border:1px solid rgba(0,212,170,.2);display:flex;align-items:center;justify-content:center;margin-bottom:20px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div style="font-size:16px;font-weight:600;color:var(--tx);margin-bottom:6px">Nenhum backtest realizado</div>
          <div style="font-size:13px;color:var(--txs);max-width:320px;line-height:1.5">Monte sua primeira estratégia no wizard e rode um backtest para ver os resultados aqui.</div>
        </div>`;
      return;
    }

    if (countEl) countEl.textContent = backtests.length + ' ' + (backtests.length === 1 ? 'teste realizado' : 'testes realizados');
    container.style.cssText = 'display:block';

    const list = div('history-list');
    backtests.forEach(bt => {
      const metrics = (bt.result && bt.result.metrics) ? bt.result.metrics : {};
      const cfg     = bt.config || {};
      const profit  = metrics.total_net_profit || 0;
      const ok      = profit >= 0;

      const dateStr = new Date(bt.created_at).toLocaleString('pt-BR', {
        day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
      });

      const conditions = (cfg.conditions || []).map(c => {
        const p = c.params || {};
        let label = c.name || c.id || '?';
        if (p.per && p.per2) label += `(${p.per}/${p.per2})`;
        else if (p.per)      label += `(${p.per})`;
        if (p.cond)          label += ' — ' + p.cond;
        return label;
      });

      const dir = cfg.direction === 'long' ? 'Compra' : cfg.direction === 'short' ? 'Venda' : 'Compra e Venda';

      const card = div('history-card');
      card.addEventListener('click', () => viewHistoryItemFromDB(bt));

      const top = div('history-card-top');
      const strat = div('history-card-strat');
      strat.textContent = `${cfg.asset || '—'} · ${cfg.tf || '—'} · ${dir}`;
      const dateEl = div('history-card-date');
      dateEl.textContent = dateStr;
      const verdict = div('history-card-verdict ' + (ok ? 'ok' : 'bad'));
      verdict.textContent = ok ? 'LUCRATIVA' : 'DEFICITÁRIA';
      top.append(strat, verdict, dateEl);
      card.appendChild(top);

      const condsEl = div('history-card-conds');
      conditions.forEach(c => { const tag = div('history-card-cond'); tag.textContent = c; condsEl.appendChild(tag); });
      card.appendChild(condsEl);

      const metricsEl = div('history-card-metrics');
      const addM = (label, val, color) => {
        const m = div('history-card-metric');
        const l = div('history-card-metric-label'); l.textContent = label;
        const v = div('history-card-metric-value'); v.textContent = val; if (color) v.style.color = color;
        m.append(l, v); metricsEl.appendChild(m);
      };
      addM('Resultado', (ok?'+':'') + 'R$ ' + Math.abs(profit).toLocaleString('pt-BR', {maximumFractionDigits:0}), ok ? '#10B981' : '#EF4444');
      addM('Trades', (metrics.total_trades || 0).toLocaleString('pt-BR'));
      addM('Win Rate', (metrics.win_rate || 0).toFixed(1) + '%', '#F59E0B');
      addM('Max DD', '-' + (metrics.max_drawdown_pct || 0).toFixed(1) + '%', '#EF4444');
      addM('Profit Factor', (metrics.profit_factor || 0).toFixed(2), (metrics.profit_factor || 0) > 1 ? '#00D4AA' : '#EF4444');
      card.appendChild(metricsEl);

    });

  } catch (e) {

    if (container) container.innerHTML = '<div style="color:var(--txs);text-align:center;padding:40px 20px">Erro ao carregar histórico. Tente novamente.</div>';
  }
}

async function viewHistoryItemFromDB(bt) {
  if (!bt || !bt.result) return;
  const metrics = bt.result.metrics || {};
  CURRENT_BACKEND_METRICS = metrics;
  CURRENT_BACKTEST_ID = bt.id;
  const deposit = metrics.initial_deposit || 10000;
  EQ = convertBackendResult(bt.result, deposit);
  if (EQ.length === 0) EQ = [{ v: 0, dd: 0, pnl: 0, t: 'N/A' }];
  EQ_ANALYSIS = computeAnalysis(EQ, deposit);
  if (bt.config) Object.assign(state.cfg, bt.config);
  const cfg = bt.config || {};
  const dateStr = new Date(bt.created_at).toLocaleString('pt-BR', {
    day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
  const conditions = (cfg.conditions || []).map(c => {
    const p = c.params || {};
    let label = c.name || c.id || '?';
    if (p.per && p.per2) label += `(${p.per}/${p.per2})`;
    else if (p.per)      label += `(${p.per})`;
    if (p.cond)          label += ' — ' + p.cond;
    return label;
  });
  viewingHistoryItem = {
    id: bt.id,
    asset: cfg.asset || '—',
    tf: cfg.tf || '—',
    direction: cfg.direction || 'both',
    date: dateStr,
    conditions,
  };
  state.screen = 'results';
  const main = document.getElementById('main');
  main.replaceChildren(renderResults());
  _lwcFlush();
}

let tourActive=false, tourStepIdx=0, tourCurrentSteps=[];

function startTour(steps){
  if(!steps||!steps.length)return;
  tourActive=true;tourStepIdx=0;tourCurrentSteps=steps;
  showTourStep();
}

function startTourForCurrentScreen(){
  if(state.screen==='wizard') startTour(TOUR_STEPS.wizard);
  else if(state.screen==='results') startTour(TOUR_STEPS.results);
  else if(currentScreen==='history') startTour(TOUR_STEPS.history);
}

function showTourStep(){
  clearTour();
  if(tourStepIdx>=tourCurrentSteps.length){endTour();return;}
  const step=tourCurrentSteps[tourStepIdx];
  const target=document.querySelector(step.sel);
  if(!target){tourStepIdx++;showTourStep();return;}

  // Backdrop
  const backdrop=div('tour-backdrop');
  backdrop.id='tour-backdrop';
  backdrop.addEventListener('click',endTour);
  document.body.appendChild(backdrop);

  // Highlight
  const rect=target.getBoundingClientRect();
  const highlight=div('tour-highlight');
  highlight.id='tour-highlight';
  highlight.style.cssText=`position:fixed;left:${rect.left-4}px;top:${rect.top-4}px;width:${rect.width+8}px;height:${rect.height+8}px`;
  document.body.appendChild(highlight);

  // Ensure target is visible above backdrop
  target.style.position=target.style.position||'relative';
  target.style.zIndex='901';
  target.dataset.tourRestore='1';

  // Tooltip
  const tooltip=div('tour-tooltip');
  tooltip.id='tour-tooltip';

  const titleEl=div('tour-tooltip-title');
  titleEl.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg> ${step.title}`;
  const bodyEl=div('tour-tooltip-body');bodyEl.textContent=step.body;

  const footer=div('tour-tooltip-footer');
  const counter=div('tour-tooltip-counter');counter.textContent=`${tourStepIdx+1} de ${tourCurrentSteps.length}`;
  const btns=div('tour-tooltip-btns');
  const skipBtn=h('button',{class:'tour-skip',onclick:endTour});skipBtn.textContent='Pular';
  const nextBtn=h('button',{class:'tour-next',onclick:nextTourStep});
  nextBtn.textContent=tourStepIdx<tourCurrentSteps.length-1?'Próximo':'Entendi!';
  btns.append(skipBtn,nextBtn);footer.append(counter,btns);

  // Arrow
  const arrow=div('tour-arrow');

  tooltip.append(titleEl,bodyEl,footer);
  // Renderiza invisível primeiro para medir dimensões reais
  tooltip.style.cssText='position:fixed;visibility:hidden;left:0;top:0';
  document.body.appendChild(tooltip);

  // Mede após renderização
  const ttRect=tooltip.getBoundingClientRect();
  let left=rect.left, top;

  // Tenta posição preferida, faz fallback se não couber
  const spaceBelow = window.innerHeight - rect.bottom - 12;
  const spaceAbove = rect.top - 12;
  let useBottom = (step.pos==='bottom'||!step.pos) ? true : false;

  // Fallback: se não couber na posição preferida, tenta o outro lado
  if(useBottom && spaceBelow < ttRect.height && spaceAbove >= ttRect.height) useBottom=false;
  if(!useBottom && spaceAbove < ttRect.height && spaceBelow >= ttRect.height) useBottom=true;

  if(useBottom){
    top=rect.bottom+12;
    arrow.className='tour-arrow tour-arrow-bottom';
  } else {
    top=rect.top-ttRect.height-12;
    arrow.className='tour-arrow tour-arrow-top';
  }
  tooltip.appendChild(arrow);

  // Mantém dentro da viewport horizontalmente
  if(left+ttRect.width>window.innerWidth-16) left=window.innerWidth-ttRect.width-16;
  if(left<16) left=16;
  // Garante que não sai da viewport verticalmente
  if(top<8) top=8;
  if(top+ttRect.height>window.innerHeight-8) top=window.innerHeight-ttRect.height-8;

  tooltip.style.cssText=`position:fixed;left:${left}px;top:${top}px`;
}

function nextTourStep(){tourStepIdx++;showTourStep();}

function clearTour(){
  document.getElementById('tour-backdrop')?.remove();
  document.getElementById('tour-highlight')?.remove();
  document.getElementById('tour-tooltip')?.remove();
  document.querySelectorAll('[data-tour-restore]').forEach(el=>{el.style.zIndex='';delete el.dataset.tourRestore;});
}

function endTour(){
  clearTour();tourActive=false;tourStepIdx=0;tourCurrentSteps=[];
  try{localStorage.setItem('bt_tour_done','1');}catch(e){}
}

function maybeAutoTour(){
  try{if(localStorage.getItem('bt_tour_done'))return;}catch(e){}
  setTimeout(()=>{if(state.screen==='wizard')startTour(TOUR_STEPS.wizard);},600);
}

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

async function generateShareCard(){

  const gd=cx.createLinearGradient(0,0,S,0);

  cx.fillStyle=gd;cx.fillRect(0,0,S,sc(2));
  const gG=cx.createRadialGradient(S/2,sc(120),0,S/2,sc(120),sc(250));
  gG.addColorStop(0,ok?'rgba(16,185,129,0.05)':'rgba(239,68,68,0.05)');gG.addColorStop(1,'transparent');
  cx.fillStyle=gG;cx.fillRect(0,0,S,sc(300));

  // Header

  rrect(cx,lx,ly,sc(24),sc(24),sc(6));cx.fill();cx.stroke();
  cx.strokeStyle='#00D4AA';cx.lineWidth=sc(1.5);cx.lineCap='round';
  cx.beginPath();cx.moveTo(lx+sc(6),ly+sc(4));cx.lineTo(lx+sc(6),ly+sc(18));cx.lineTo(lx+sc(18),ly+sc(18));cx.stroke();
  cx.beginPath();cx.moveTo(lx+sc(9),ly+sc(14));cx.lineTo(lx+sc(12),ly+sc(10));cx.lineTo(lx+sc(15),ly+sc(12));cx.lineTo(lx+sc(18),ly+sc(8));cx.stroke();

  cx.fillStyle=aG;cx.beginPath();cx.moveTo(px(0),chY+chH);EQ.forEach((d,i)=>cx.lineTo(px(i),py(d.v)));cx.lineTo(px(EQ.length-1),chY+chH);cx.closePath();cx.fill();
  cx.strokeStyle=ok?'#10B981':'#EF4444';cx.lineWidth=sc(1.5);cx.lineCap='round';cx.lineJoin='round';

async function shareResult(evt){
  const btn=evt?evt.currentTarget:event.currentTarget;
  const orig=btn.innerHTML;
  btn.innerHTML='<span style="display:inline-flex;animation:spin .6s linear infinite">\u27f3</span> Gerando...';btn.disabled=true;
  try{
    const blob=await generateShareCard();
    const file=new File([blob],'backtest-pro-resultado.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Resultado do Backtest Pro'});
    }else{
      const url=URL.createObjectURL(blob);const a=document.createElement('a');
      a.href=url;a.download='backtest-pro-resultado.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }catch(e){if(e.name!=='AbortError')console.error('Share error:',e);}
  btn.innerHTML=orig;btn.disabled=false;
}
